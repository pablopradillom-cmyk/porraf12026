<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos de grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#241536;
    --plum-2:#33204a;
    --paper:#F5EFE2;
    --paper-2:#ece2cd;
    --ink:#241536;
    --mustard:#F2B705;
    --coral:#E8553F;
    --teal:#3FA796;
    --line: rgba(36,21,54,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, var(--plum-2) 0%, var(--plum) 45%),
      var(--plum);
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }
  header{
    width:100%;
    text-align:center;
    margin-bottom:6px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--mustard);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(28px,7vw,36px);
    margin:0;
    line-height:1.05;
  }
  h1 em{
    font-style:italic;
    font-weight:600;
    color:var(--mustard);
  }
  .sub{
    margin-top:8px;
    font-size:13.5px;
    color:rgba(245,239,226,0.65);
    max-width:340px;
  }
  .progress-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0 18px;
  }
  .progress-track{
    flex:1;
    height:5px;
    background:rgba(245,239,226,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--mustard);
    border-radius:4px;
    transition:width .35s ease;
  }
  .progress-count{
    font-size:12px;
    color:rgba(245,239,226,0.55);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }

  .stage{
    position:relative;
    width:100%;
    height:300px;
    margin-bottom:26px;
  }
  .card{
    position:absolute;
    inset:0;
    border-radius:18px;
    background:var(--paper);
    color:var(--ink);
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:34px 28px;
    text-align:center;
  }
  .card.behind-1{
    transform: translateY(10px) scale(0.96) rotate(-2deg);
    background:var(--paper-2);
    z-index:1;
  }
  .card.behind-2{
    transform: translateY(18px) scale(0.92) rotate(2deg);
    background:var(--paper-2);
    opacity:0.7;
    z-index:0;
  }
  .card.top{
    z-index:2;
    transition: transform .28s ease, opacity .28s ease;
  }
  .card.top.leave-like{
    transform: translateX(140%) rotate(14deg);
    opacity:0;
  }
  .card.top.leave-dislike{
    transform: translateX(-140%) rotate(-14deg);
    opacity:0;
  }
  .card.top.enter{
    animation: cardIn .3s ease;
  }
  @keyframes cardIn{
    from{ transform: translateY(14px) scale(0.97); opacity:0; }
    to{ transform: translateY(0) scale(1); opacity:1; }
  }
  .card-index{
    position:absolute;
    top:16px;
    left:18px;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(36,21,54,0.4);
    font-weight:700;
  }
  .card-text{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(20px,5.2vw,25px);
    line-height:1.3;
  }
  .finger{
    position:absolute;
    bottom:14px;
    right:18px;
    font-size:20px;
    opacity:0.5;
  }

  .actions{
    width:100%;
    display:flex;
    gap:14px;
    margin-bottom:8px;
  }
  button.choice{
    flex:1;
    border:none;
    border-radius:14px;
    padding:16px 10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    transition: transform .12s ease, filter .12s ease;
    color:var(--paper);
  }
  button.choice:active{ transform: scale(0.96); }
  .btn-dislike{ background:var(--coral); }
  .btn-like{ background:var(--teal); }
  .btn-icon{ font-size:22px; }

  .skip-row{
    width:100%;
    text-align:center;
    margin-top:4px;
  }
  .link-btn{
    background:none;
    border:none;
    color:rgba(245,239,226,0.55);
    font-family:'Space Grotesk', sans-serif;
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:6px;
  }

  .done{
    width:100%;
    text-align:center;
    padding:50px 10px 20px;
  }
  .done h2{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:26px;
    margin-bottom:8px;
  }
  .done p{
    color:rgba(245,239,226,0.65);
    font-size:14px;
    margin-bottom:24px;
  }
  .restart-btn{
    background:var(--mustard);
    color:var(--plum);
    border:none;
    border-radius:12px;
    padding:14px 26px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }

  /* Menú principal */
  .menu-header{
    text-align:center;
    margin-bottom:34px;
  }
  .menu-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .game-card{
    width:100%;
    background:var(--paper);
    color:var(--ink);
    border:none;
    border-radius:16px;
    padding:20px 20px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:16px;
    box-shadow: 0 14px 28px rgba(0,0,0,0.25);
    transition: transform .12s ease;
  }
  .game-card:active{ transform: scale(0.97); }
  .game-emoji{
    font-size:30px;
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .game-card.probable .game-emoji{ background:rgba(63,167,150,0.18); }
  .game-card.song .game-emoji{ background:rgba(232,85,63,0.15); }
  .game-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:18px;
    margin-bottom:3px;
  }
  .game-desc{
    font-size:12.5px;
    color:rgba(36,21,54,0.6);
    line-height:1.35;
  }
  .top-back{
    align-self:flex-start;
    background:none;
    border:1px solid rgba(245,239,226,0.3);
    color:var(--paper);
    border-radius:20px;
    padding:6px 14px;
    font-size:12px;
    cursor:pointer;
    margin-bottom:18px;
  }

  /* Canta la palabra */
  .word-stage{
    width:100%;
    background:var(--paper);
    border-radius:20px;
    padding:46px 24px;
    text-align:center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .word-stage::before{
    content:"♪";
    position:absolute;
    top:-10px;
    right:10px;
    font-size:90px;
    color:rgba(232,85,63,0.08);
  }
  .word-label{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--coral);
    font-weight:700;
    margin-bottom:10px;
  }
  .word-text{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(34px,10vw,48px);
    color:var(--ink);
    line-height:1.1;
  }
  .next-word-btn{
    width:100%;
    background:var(--coral);
    color:var(--paper);
    border:none;
    border-radius:14px;
    padding:18px 10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    margin-bottom:26px;
    transition: transform .12s ease;
  }
  .next-word-btn:active{ transform: scale(0.97); }

  .scoreboard{
    width:100%;
  }
  .scoreboard-title{
    font-family:'Fraunces', serif;
    font-size:16px;
    margin-bottom:10px;
    color:rgba(245,239,226,0.85);
  }
  .player-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(245,239,226,0.08);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .player-name{
    flex:1;
    font-size:14px;
    font-weight:500;
  }
  .player-score{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:18px;
    color:var(--mustard);
    min-width:22px;
    text-align:center;
  }
  .score-btn{
    width:28px;
    height:28px;
    border-radius:50%;
    border:none;
    background:rgba(245,239,226,0.15);
    color:var(--paper);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .score-btn:active{ transform: scale(0.9); }
  .remove-player{
    background:none;
    border:none;
    color:rgba(245,239,226,0.35);
    font-size:15px;
    cursor:pointer;
    padding:2px 4px;
  }
  .add-player-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .add-player-row input{
    flex:1;
    background:rgba(245,239,226,0.08);
    border:1px solid rgba(245,239,226,0.2);
    border-radius:10px;
    padding:10px 12px;
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
  }
  .add-player-row input::placeholder{ color:rgba(245,239,226,0.4); }
  .add-player-row button{
    background:var(--mustard);
    color:var(--plum);
    border:none;
    border-radius:10px;
    padding:0 18px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .empty-players{
    color:rgba(245,239,226,0.45);
    font-size:12.5px;
    padding:6px 2px 4px;
  }

  /* Contador */
  .citadels-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper);
    color:var(--ink);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow: 0 10px 22px rgba(0,0,0,0.2);
  }
  .citadels-name{
    flex:1;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:16px;
  }
  .citadels-score{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:26px;
    min-width:38px;
    text-align:center;
    color:var(--plum);
  }
  .citadels-arrows{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .arrow-btn{
    width:34px;
    height:26px;
    border:none;
    border-radius:8px;
    background:var(--paper-2);
    color:var(--plum);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .arrow-btn.up{ background:rgba(63,167,150,0.18); color:var(--teal); }
  .arrow-btn.down{ background:rgba(232,85,63,0.14); color:var(--coral); }
  .arrow-btn:active{ transform: scale(0.9); }
  .citadels-remove{
    background:none;
    border:none;
    color:rgba(36,21,54,0.3);
    font-size:15px;
    cursor:pointer;
    padding:2px 2px 2px 6px;
  }
  .citadels-reset{
    width:100%;
    background:rgba(245,239,226,0.1);
    border:1px solid rgba(245,239,226,0.25);
    color:var(--paper);
    border-radius:12px;
    padding:12px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    margin-top:16px;
  }

  /* Emparejar con el dedo */
  .stepper-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin:28px 0 8px;
  }
  .stepper-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    border:none;
    background:var(--paper);
    color:var(--plum);
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stepper-btn:active{ transform: scale(0.92); }
  .stepper-value{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:40px;
    min-width:50px;
    text-align:center;
  }
  .stepper-label{
    text-align:center;
    font-size:12.5px;
    color:rgba(245,239,226,0.55);
    margin-bottom:6px;
  }
  .start-fingers-btn{
    width:100%;
    background:var(--mustard);
    color:var(--plum);
    border:none;
    border-radius:14px;
    padding:16px 10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    margin-top:26px;
  }

  .fingers-wrap{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    background: radial-gradient(circle at 50% 30%, var(--plum-2) 0%, var(--plum) 60%);
    touch-action:none;
  }
  .fingers-header{
    flex-shrink:0;
    padding:18px 18px 14px;
    text-align:center;
  }
  .fingers-header .top-back{ margin-bottom:10px; }
  .fingers-status{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:17px;
    color:var(--paper);
  }
  .fingers-hint{
    font-size:12.5px;
    color:rgba(245,239,226,0.55);
    margin-top:4px;
  }
  .fingers-touch-area{
    flex:1;
    position:relative;
    touch-action:none;
  }
  .lines-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  .finger-circle{
    position:absolute;
    width:64px;
    height:64px;
    border-radius:50%;
    background:rgba(245,239,226,0.16);
    border:2px solid rgba(245,239,226,0.5);
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--paper);
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:22px;
    pointer-events:none;
    transition: opacity .45s ease;
  }
  .finger-circle.fading{
    opacity:0;
  }
  .finger-circle.pulse{
    animation: fingerPulse 1s ease-in-out infinite;
  }
  @keyframes fingerPulse{
    0%,100%{ transform:translate(-50%,-50%) scale(1); }
    50%{ transform:translate(-50%,-50%) scale(1.08); }
  }
  .countdown-overlay{
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:20px;
    color:var(--mustard);
    display:none;
  }
  .legend-panel{
    flex-shrink:0;
    padding:14px 20px 22px;
    display:none;
  }
  .legend-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-bottom:16px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(245,239,226,0.1);
    border-radius:20px;
    padding:6px 12px 6px 8px;
    font-size:12.5px;
    color:var(--paper);
  }
  .legend-swatch{
    width:14px;
    height:14px;
    border-radius:50%;
    flex-shrink:0;
  }
  .fingers-actions{
    display:flex;
    gap:10px;
  }
  .fingers-actions button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:13px 8px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .retry-btn{ background:var(--mustard); color:var(--plum); }
  .regroup-btn{ background:rgba(245,239,226,0.12); color:var(--paper); }

  /* Tests de personalidad */
  .quiz-card{
    width:100%;
    background:var(--paper);
    color:var(--ink);
    border-radius:18px;
    padding:26px 22px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.3);
    margin-bottom:20px;
  }
  .quiz-qnum{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--coral);
    font-weight:700;
    margin-bottom:8px;
  }
  .quiz-qtext{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    line-height:1.35;
    margin-bottom:18px;
  }
  .quiz-options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .quiz-option{
    text-align:left;
    padding:13px 15px;
    border-radius:12px;
    border:1.5px solid rgba(36,21,54,0.12);
    background:var(--paper-2);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-size:13.5px;
    line-height:1.4;
    cursor:pointer;
    transition: background .12s ease, transform .12s ease;
  }
  .quiz-option:active{ transform: scale(0.98); }

  .name-card{
    width:100%;
    background:var(--paper);
    color:var(--ink);
    border-radius:18px;
    padding:30px 24px;
    text-align:center;
    box-shadow: 0 16px 32px rgba(0,0,0,0.3);
  }
  .name-card label{
    display:block;
    font-size:12.5px;
    color:rgba(36,21,54,0.6);
    margin-bottom:10px;
  }
  .name-card input{
    width:100%;
    background:var(--paper-2);
    border:1.5px solid rgba(36,21,54,0.15);
    border-radius:12px;
    padding:14px 14px;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    color:var(--ink);
    text-align:center;
    margin-bottom:18px;
  }

  .result-emoji-badge{
    font-size:38px;
    text-align:center;
    margin-bottom:6px;
  }
  .result-player-name{
    text-align:center;
    font-size:12.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--mustard);
    font-weight:700;
    margin-bottom:14px;
  }
  .result-meter-track{
    height:14px;
    border-radius:8px;
    background:rgba(245,239,226,0.15);
    overflow:hidden;
  }
  .result-meter-fill{
    height:100%;
    border-radius:8px;
    background:linear-gradient(90deg, var(--teal), var(--mustard), var(--coral));
    transition: width .6s ease;
  }
  .result-percent{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:36px;
    text-align:center;
    margin-top:10px;
  }
  .result-cat{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:21px;
    text-align:center;
    color:var(--mustard);
    margin:4px 0 12px;
  }
  .result-desc{
    font-size:13.5px;
    text-align:center;
    color:rgba(245,239,226,0.75);
    line-height:1.5;
    max-width:340px;
    margin:0 auto 20px;
  }
  .trait-panel{
    background:var(--paper);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:20px;
  }
  .trait-panel-title{
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(36,21,54,0.5);
    margin-bottom:6px;
  }
  .trait-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--ink);
    padding:6px 0;
    border-bottom:1px dotted rgba(36,21,54,0.15);
  }
  .trait-row:last-child{ border-bottom:none; }
  .trait-row span:last-child{ color:var(--coral); font-weight:700; }

  .quiz-actions{
    display:flex;
    gap:10px;
  }
  .quiz-actions button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px 8px;
    font-family:'Space Grotesk', sans-serif;

// --- Persistencia local (por móvil, no compartida entre dispositivos) ---
function lsGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}
function lsSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
  }catch(e){
    console.error('No se pudo guardar en este dispositivo', e);
  }
}

}

function choose(type){
  const q = state.deck[state.index];
  state.animClass = type === 'like' ? 'leave-like' : 'leave-dislike';
  render();

  setTimeout(() => {
    if(type === 'like'){
      state.liked.push(q);
      saveLiked();
    }
    state.index += 1;
    state.animClass = 'enter';
    if(state.index >= state.deck.length){
      state.view = 'done';
    }
    render();
  }, 260);
}

        <div class="quadrant-dot${opts.big ? ' big' : ''}" style="left:${Math.max(2,Math.min(98,d.x))}%; top:${Math.max(2,Math.min(98,100-d.y))}%; background:${d.color};" title="${escapeHtml(d.label)}"></div>

}

function attachFingersHandlers(){
  const layer = document.getElementById('touchLayer');
  if(!layer) return;
  const svg = document.getElementById('linesSvg');
  const SVG_NS = 'http://www.w3.org/2000/svg';
  let lines = []; // { id1, id2, el }
  const myGen = ++state.fingers.generation;

  function relPos(clientX, clientY){
    const rect = layer.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function addCircle(id, x, y){
    const el = document.createElement('div');
    el.className = 'finger-circle pulse';
    el.textContent = '•';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    layer.appendChild(el);
    state.fingers.touches.set(id, { el, x, y });
    updateStatusText();
    maybeStartCountdown();
  }

  function moveCircle(id, x, y){
    const t = state.fingers.touches.get(id);
    if(!t) return;
    t.x = x; t.y = y;
    t.el.style.left = x + 'px';
    t.el.style.top = y + 'px';
    lines.forEach(line => {
      if(line.id1 === id) { line.el.setAttribute('x1', x); line.el.setAttribute('y1', y); }
      if(line.id2 === id) { line.el.setAttribute('x2', x); line.el.setAttribute('y2', y); }
    });
  }

  function removeCircle(id){
    const t = state.fingers.touches.get(id);
    if(!t) return;

    if(state.fingers.phase === 'result'){
      // Al levantar el dedo tras el sorteo, se mantiene visible unos segundos
      setTimeout(() => {
        if(myGen !== state.fingers.generation) return;
        if(!state.fingers.touches.has(id)) return;
        t.el.classList.add('fading');
        lines.forEach(line => {
          if(line.id1 === id || line.id2 === id){
            line.el.style.transition = 'opacity .45s ease';
            line.el.style.opacity = '0';
          }
        });
        setTimeout(() => {
          if(myGen !== state.fingers.generation) return;
          t.el.remove();
          state.fingers.touches.delete(id);
          lines = lines.filter(line => {
            if(line.id1 === id || line.id2 === id){
              line.el.remove();
              return false;
            }
            return true;
          });
        }, 450);
      }, 3500);
      return;
    }

    t.el.remove();
    state.fingers.touches.delete(id);
    lines = lines.filter(line => {
      if(line.id1 === id || line.id2 === id){
        line.el.remove();
        return false;
      }
      return true;
    });
    updateStatusText();
    maybeStartCountdown();
  }

  function updateStatusText(){
    const statusEl = document.getElementById('fingerStatus');
    if(!statusEl) return;
    const n = state.fingers.touches.size;
    if(state.fingers.phase === 'result') return;
    statusEl.textContent = n === 0
      ? 'Poned el dedo en la pantalla'
      : (n === 1 ? '1 dedo puesto' : n + ' dedos puestos');
  }

  function maybeStartCountdown(){
    if(state.fingers.phase !== 'placing') return;
    const n = state.fingers.touches.size;
    const overlay = document.getElementById('countdownOverlay');
    if(n >= 2){
      clearFingersCountdown();
      state.fingers.countdownValue = 3;
      if(overlay){ overlay.style.display = 'block'; overlay.textContent = 'Sorteando en 3…'; }
      state.fingers.countdownTimer = setInterval(() => {
        state.fingers.countdownValue -= 1;
        if(state.fingers.countdownValue <= 0){
          clearFingersCountdown();
          finishFingersAssignment();
        } else if(overlay){
          overlay.textContent = 'Sorteando en ' + state.fingers.countdownValue + '…';
        }
      }, 1000);
    } else {
      clearFingersCountdown();
      if(overlay) overlay.style.display = 'none';
    }
  }

  function finishFingersAssignment(){
    const ids = Array.from(state.fingers.touches.keys()); // orden de colocación
    const groupCount = state.fingers.groupCount;
    const leaderCount = Math.min(state.fingers.leaderCount, groupCount, ids.length);

    const leaderIds = ids.slice(0, leaderCount);
    const restIds = shuffle(ids.slice(leaderCount));

    const assignment = new Map(); // id -> groupIdx

    // Las personas principales van a grupos distintos entre sí, en orden aleatorio
    const groupSlotsForLeaders = shuffle(Array.from({ length: groupCount }, (_, i) => i)).slice(0, leaderCount);
    leaderIds.forEach((id, i) => assignment.set(id, groupSlotsForLeaders[i]));

    // El resto se reparte al azar y de forma equilibrada entre todos los grupos
    restIds.forEach((id, idx) => assignment.set(id, idx % groupCount));

    const counts = new Array(groupCount).fill(0);
    const buckets = Array.from({ length: groupCount }, () => []);
    const leaderIdSet = new Set(leaderIds);

    ids.forEach(id => {
      const groupIdx = assignment.get(id);
      counts[groupIdx] += 1;
      buckets[groupIdx].push(id);
      const t = state.fingers.touches.get(id);
      if(!t) return;
      const color = GROUP_COLORS[groupIdx % GROUP_COLORS.length];
      t.el.classList.remove('pulse');
      t.el.style.background = color.bg;
      t.el.style.borderColor = color.bg;
      t.el.textContent = (leaderIdSet.has(id) ? '★' : '') + (groupIdx + 1);
    });

    // Dibuja una línea uniendo, en cadena, a todos los dedos del mismo grupo
    buckets.forEach((bucket, groupIdx) => {
      if(bucket.length < 2) return;
      const color = GROUP_COLORS[groupIdx % GROUP_COLORS.length];
      for(let k = 0; k < bucket.length - 1; k++){
        const id1 = bucket[k];
        const id2 = bucket[k+1];
        const t1 = state.fingers.touches.get(id1);
        const t2 = state.fingers.touches.get(id2);
        if(!t1 || !t2) continue;
        const lineEl = document.createElementNS(SVG_NS, 'line');
        lineEl.setAttribute('x1', t1.x);
        lineEl.setAttribute('y1', t1.y);
        lineEl.setAttribute('x2', t2.x);
        lineEl.setAttribute('y2', t2.y);
        lineEl.setAttribute('stroke', color.bg);
        lineEl.setAttribute('stroke-width', '5');
        lineEl.setAttribute('stroke-linecap', 'round');
        lineEl.setAttribute('opacity', '0.85');
        svg.appendChild(lineEl);
        lines.push({ id1, id2, el: lineEl });
      }
    });

    state.fingers.phase = 'result';

    const overlay = document.getElementById('countdownOverlay');
    if(overlay) overlay.style.display = 'none';

    const statusEl = document.getElementById('fingerStatus');
    if(statusEl) statusEl.textContent = '¡Grupos listos!';
    const hintEl = document.getElementById('fingerHint');
    if(hintEl) hintEl.textContent = 'Podéis levantar los dedos.';

    const legend = document.getElementById('legendPanel');
    if(legend){
      legend.style.display = 'block';
      const list = document.getElementById('legendList');
      list.innerHTML = counts.map((c, i) => `
        <div class="legend-item">
          <span class="legend-swatch" style="background:${GROUP_COLORS[i % GROUP_COLORS.length].bg}"></span>
          Grupo ${i+1}: ${c}
        </div>
      `).join('');
    }
  }

  function onStart(e){
    e.preventDefault();
    for(const touch of e.changedTouches){
      const { x, y } = relPos(touch.clientX, touch.clientY);
      addCircle(touch.identifier, x, y);
    }
  }
  function onMove(e){
    e.preventDefault();
    for(const touch of e.changedTouches){
      const { x, y } = relPos(touch.clientX, touch.clientY);
      moveCircle(touch.identifier, x, y);
    }
  }
  function onEnd(e){
    e.preventDefault();
    for(const touch of e.changedTouches){
      removeCircle(touch.identifier);
    }
  }

  layer.addEventListener('touchstart', onStart, { passive:false });
  layer.addEventListener('touchmove', onMove, { passive:false });
  layer.addEventListener('touchend', onEnd, { passive:false });
  layer.addEventListener('touchcancel', onEnd, { passive:false });
}

function quizSummaryText(sortedPlayers, testLabel, mode){
  const n = sortedPlayers.length;
  if(n === 0) return '';
  const top = sortedPlayers[0];
  const bottom = sortedPlayers[n-1];
  const avg = Math.round(sortedPlayers.reduce((a,p)=>a+p.percent,0) / n);

  if(n === 1){
    return mode === 'gracioso'
      ? `${top.name} juega en solitario con un ${top.percent}% — "${top.title}". De momento nadie le hace sombra… porque nadie más ha jugado todavía 👀. Añadid más gente para comparar.`
      : `${top.name} ha obtenido un ${top.percent}% (${top.title}) en "${testLabel}". Añade más jugadores para poder comparar resultados.`;
  }

  const spread = top.percent - bottom.percent;

  if(mode === 'gracioso'){
    return `👑 ${top.name} se corona con un ${top.percent}% — oficialmente "${top.title}". Mientras tanto, ${bottom.name} aterriza con un discreto ${bottom.percent}%, instalado/a en "${bottom.title}". Entre los dos hay ${spread} puntos de diferencia, casi universos distintos. Media del grupo: ${avg}%.`;
  }
  return `En "${testLabel}" han jugado ${n} personas. La media del grupo es ${avg}%. La puntuación más alta es de ${top.name} con ${top.percent}% (${top.title}), y la más baja es de ${bottom.name} con ${bottom.percent}% (${bottom.title}). Diferencia entre ambos: ${spread} puntos porcentuales.`;
}

function sciSummaryText(players, mode){
  const n = players.length;
  if(n === 0) return '';
  const avgA = Math.round(players.reduce((a,p)=>a+p.aPercent,0) / n);
  const avgC = Math.round(players.reduce((a,p)=>a+p.cPercent,0) / n);
  const topA = [...players].sort((a,b)=>b.aPercent-a.aPercent)[0];
  const topC = [...players].sort((a,b)=>b.cPercent-a.cPercent)[0];

  const counts = {};
  players.forEach(p => { counts[p.title] = (counts[p.title]||0) + 1; });
  const countsText = Object.entries(counts).map(([title,c]) => `${c} ${title}`).join(', ');

  if(n === 1){
    const p = players[0];
    return mode === 'gracioso'
      ? `${p.name} anda solo/a en esto: ${p.aPercent}% de Agencia y ${p.cPercent}% de Comunión — "${p.title}". Traed a alguien más para poder compararlo con algo.`
      : `${p.name} obtuvo ${p.aPercent}% en Agencia y ${p.cPercent}% en Comunión (${p.title}). Añade más jugadores para comparar.`;
  }

  if(mode === 'gracioso'){
    return `🎯 Medalla de Agencia para ${topA.name} (${topA.aPercent}%) — el/la que se lanza sin mirar atrás. 💛 Medalla de Comunión para ${topC.name} (${topC.cPercent}%) — el hombro sobre el que llora todo el grupo. Media general: ${avgA}% Agencia / ${avgC}% Comunión. Reparto de perfiles: ${countsText}.`;
  }
  return `Media del grupo: ${avgA}% en Agencia y ${avgC}% en Comunión. ${topA.name} lidera en Agencia (${topA.aPercent}%). ${topC.name} lidera en Comunión (${topC.cPercent}%). Perfiles presentes en el grupo: ${countsText}.`;
}

              <div class="game-title">${t.label}</div>
              <div class="game-desc">${t.tagline}</div>
            </div>
          </button>
        `).join('')}
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    app.querySelectorAll('[data-test]').forEach(btn=>{
      btn.onclick = () => selectQuizTest(btn.dataset.test);
    });
    return;
  }

  const test = QUIZ_TESTS[q.testId];

  if(q.phase === 'name'){
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">${test.emoji} ${test.label}</div>
        <h1>¿Quién <em>juega</em>?</h1>
        <div class="sub">Pasa el móvil a la siguiente persona y que escriba su nombre para empezar su ronda.</div>
      </header>
      <div class="name-card" style="margin-top:24px;">
        <label>Nombre del jugador</label>
        <input type="text" id="quizNameInput" placeholder="Escribe tu nombre" value="${escapeHtml(q.currentName)}">
        <button class="start-fingers-btn" id="startQuizBtn" style="margin-top:0;">Empezar mis preguntas</button>
      </div>
      ${q.players.length ? `
        <div style="margin-top:20px; text-align:center;">
          <button class="saved-toggle" id="viewLeaderboardBtn">Ver comparativa (${q.players.length} jugador${q.players.length===1?'':'es'})</button>
        </div>
      ` : ''}
    `;
    document.getElementById('backMenu').onclick = goMenu;
    const input = document.getElementById('quizNameInput');
    input.oninput = (e) => { state.quiz.currentName = e.target.value; };
    input.onkeydown = (e) => { if(e.key === 'Enter') startQuizPlayer(); };
    document.getElementById('startQuizBtn').onclick = startQuizPlayer;
    const lbBtn = document.getElementById('viewLeaderboardBtn');
    if(lbBtn) lbBtn.onclick = viewQuizLeaderboard;
    return;
  }

  if(q.phase === 'question'){
    const question = test.questions[q.qIndex];
    const total = test.questions.length;
    const pct = Math.round((q.qIndex/total)*100);
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">${test.emoji} ${escapeHtml(q.currentName)}</div>
        <h1>${test.label}</h1>
      </header>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-count">${q.qIndex+1}/${total}</div>
      </div>
      <div class="quiz-card">
        <div class="quiz-qnum">Pregunta ${q.qIndex+1}</div>
        <div class="quiz-qtext">${escapeHtml(question.text)}</div>
        <div class="quiz-options">
          ${question.opts.map((opt, i) => `
            <button class="quiz-option" data-v="${opt.v}">${escapeHtml(opt.t)}</button>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    app.querySelectorAll('.quiz-option').forEach(btn=>{
      btn.onclick = () => selectQuizOption(parseInt(btn.dataset.v));
    });
    return;
  }

  if(q.phase === 'playerResult'){
    const r = q.lastResult;
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">${test.emoji} Resultado</div>
      </header>
      <div style="margin-top:10px;">
        <div class="result-player-name">${escapeHtml(r.name)}</div>
        <div class="result-cat">${escapeHtml(r.title)}</div>
        <div class="result-meter-track"><div class="result-meter-fill" style="width:${Math.max(0,Math.min(100,r.percent))}%"></div></div>
        <div class="result-percent">${r.percent}%</div>
        <div class="result-desc">${escapeHtml(r.desc)}</div>
        ${r.traits ? `
          <div class="trait-panel">
            <div class="trait-panel-title">Rasgos detectados (inventados)</div>
            ${r.traits.map(t => `<div class="trait-row"><span>${escapeHtml(t.label)}</span><span>${escapeHtml(t.value)}</span></div>`).join('')}
          </div>
        ` : ''}
        <div class="quiz-actions">
          <button class="quiz-btn-primary" id="anotherPlayerBtn">➕ Otro jugador</button>
          <button class="quiz-btn-secondary" id="viewLbBtn">📊 Comparativa</button>
        </div>
        <div class="quiz-disclaimer">${test.disclaimer}</div>
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('anotherPlayerBtn').onclick = addAnotherQuizPlayer;
    document.getElementById('viewLbBtn').onclick = viewQuizLeaderboard;
    return;
  }

  if(q.phase === 'leaderboard'){
    const sorted = [...q.players].sort((a,b) => b.percent - a.percent);
    const maxP = sorted.length ? sorted[0] : null;
    const minP = sorted.length ? sorted[sorted.length-1] : null;
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">${test.emoji} Comparativa</div>
        <h1>${test.label}</h1>
      </header>
      <div style="margin-top:20px;">
        ${sorted.map((p, i) => `
          <div class="leaderboard-row">
            <div class="leaderboard-rank">${i+1}</div>
            <div class="leaderboard-name">
              <strong>${escapeHtml(p.name)} ${maxP && p===maxP ? '👑' : ''} ${minP && p===minP && sorted.length>1 ? '🪨' : ''}</strong>
              <span>${escapeHtml(p.title)}</span>
            </div>
            <div class="leaderboard-percent">${p.percent}%</div>
          </div>
        `).join('') || `<div class="empty-players">Aún no ha jugado nadie.</div>`}
        ${sorted.length ? `
          <div class="summary-card">
            <div class="summary-tabs">
              <button class="summary-tab ${q.summaryMode==='normal'?'active':''}" id="tabNormal">Resumen normal</button>
              <button class="summary-tab ${q.summaryMode==='gracioso'?'active':''}" id="tabGracioso">Resumen gracioso</button>
            </div>
            <div class="summary-text">${escapeHtml(quizSummaryText(sorted, test.label, q.summaryMode))}</div>
          </div>
        ` : ''}
        <div class="quiz-actions" style="margin-top:16px;">
          <button class="quiz-btn-primary" id="anotherPlayerBtn2">➕ Otro jugador</button>
          <button class="quiz-btn-secondary" id="backPickerBtn">🔀 Cambiar test</button>
        </div>
        ${sorted.length ? `
          <div style="text-align:center; margin-top:14px;">
            <button class="saved-toggle" id="restartPlayersBtn">Borrar jugadores y empezar de cero</button>
          </div>
        ` : ''}
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('anotherPlayerBtn2').onclick = addAnotherQuizPlayer;
    document.getElementById('backPickerBtn').onclick = backToQuizPicker;
    const tabNormal = document.getElementById('tabNormal');
    const tabGracioso = document.getElementById('tabGracioso');
    if(tabNormal) tabNormal.onclick = () => setQuizSummaryMode('normal');
    if(tabGracioso) tabGracioso.onclick = () => setQuizSummaryMode('gracioso');
    const restartBtn = document.getElementById('restartPlayersBtn');
    if(restartBtn) restartBtn.onclick = restartQuizPlayers;
    return;
  }
}

function renderProbable(){
  if(state.view === 'category'){
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header class="menu-header">
        <div class="eyebrow">Señalad todos a la vez</div>
        <h1>¿Quién es <em>más probable</em>?</h1>
        <div class="sub" style="margin:10px auto 0;">Elige la categoría de frases con la que queréis jugar.</div>
      </header>
      <div class="menu-list">
        <button class="game-card probable" data-cat="clasicas">
          <div class="game-emoji">${PROBABLE_CATEGORIES.clasicas.emoji}</div>
          <div>
            <div class="game-title">${PROBABLE_CATEGORIES.clasicas.label}</div>
            <div class="game-desc">${PROBABLE_CATEGORIES.clasicas.desc}</div>
          </div>
        </button>

          </div>
        </button>
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    app.querySelectorAll('[data-cat]').forEach(btn=>{
      btn.onclick = () => selectCategory(btn.dataset.cat);
    });
    return;
  }

  if(state.view === 'saved'){
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">Tus favoritas</div>
        <h1>Frases <em>guardadas</em></h1>
      </header>
      <div class="saved-panel">
        <div class="saved-header">
          <h3>${state.liked.length} guardada${state.liked.length===1?'':'s'}</h3>
          <button class="back-link" id="backBtn">← Volver</button>
        </div>
        <div class="saved-list">
          ${state.liked.length ? state.liked.map((q,i)=>`
            <div class="saved-item">
              <span>${escapeHtml(q)}</span>
              <button class="remove-btn" data-i="${i}" title="Quitar">✕</button>
            </div>
          `).join('') : `<div class="empty-saved">Aún no has marcado ninguna con "Me gusta".</div>`}
        </div>
      </div>
    `;
    document.getElementById('backBtn').onclick = goBack;
    document.getElementById('backMenu').onclick = goMenu;
    app.querySelectorAll('.remove-btn').forEach(btn=>{
      btn.onclick = () => removeSaved(parseInt(btn.dataset.i));
    });
    return;
  }

  if(state.view === 'done'){
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">Ronda terminada</div>
        <h1>Se acabaron <em>las tarjetas</em></h1>
      </header>
      <div class="done">
        <p>Has revisado las ${state.deck.length} frases. Guardaste ${state.liked.length} con "Me gusta".</p>
        <button class="restart-btn" id="restartBtn">Barajar y jugar otra vez</button>
      </div>
      <footer>
        <button class="saved-toggle" id="savedBtn">Ver guardadas (${state.liked.length})</button>
        <div style="margin-top:6px;">
          <button class="saved-toggle" id="changeCatBtn">Cambiar categoría</button>
        </div>
      </footer>
    `;
    document.getElementById('restartBtn').onclick = restart;
    document.getElementById('savedBtn').onclick = goSaved;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('changeCatBtn').onclick = changeCategory;
    return;
  }

  const q = state.deck[state.index];
  const total = state.deck.length;
  const pct = Math.round((state.index/total)*100);

  app.innerHTML = `
    <button class="top-back" id="backMenu">← Menú</button>
    <header>
      <div class="eyebrow">${PROBABLE_CATEGORIES[state.probableCategory].emoji} ${PROBABLE_CATEGORIES[state.probableCategory].label}</div>
      <h1>¿Quién es <em>más probable</em>?</h1>
      <div class="sub">Lee la frase en voz alta y todo el grupo señala a quien crea que encaja. Dale a "me gusta" para guardarla y pasar a la siguiente.</div>
    </header>

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-count">${state.index+1}/${total}</div>
    </div>

    <div class="stage">
      <div class="card behind-2"></div>
      <div class="card behind-1"></div>
      <div class="card top ${state.animClass}" id="cardTop">
        <div class="card-index">#${state.index+1}</div>
        <div class="card-text">${escapeHtml(q)}</div>
        <div class="finger">👉</div>
      </div>
    </div>

    <div class="actions">
      <button class="choice btn-dislike" id="dislikeBtn">
        <span class="btn-icon">✕</span>
        No me gusta
      </button>
      <button class="choice btn-like" id="likeBtn">
        <span class="btn-icon">♥</span>
        Me gusta
      </button>
    </div>

    <footer>
      <button class="saved-toggle" id="savedBtn">Ver guardadas (${state.liked.length})</button>
      <div style="margin-top:6px;">
        <button class="saved-toggle" id="changeCatBtn">Cambiar categoría</button>
      </div>
    </footer>
  `;

  document.getElementById('dislikeBtn').onclick = () => choose('dislike');
  document.getElementById('likeBtn').onclick = () => choose('like');
  document.getElementById('savedBtn').onclick = goSaved;
  document.getElementById('backMenu').onclick = goMenu;
  document.getElementById('changeCatBtn').onclick = changeCategory;

  if(state.animClass === 'enter'){
    setTimeout(()=>{ state.animClass=''; }, 300);
  }
}
