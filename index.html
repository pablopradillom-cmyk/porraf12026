<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos de grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,900;1,600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#241536;
    --plum-2:#33204a;
    --paper:#F5EFE2;
    --paper-2:#ece2cd;
    --ink:#241536;
    --mustard:#F2B705;
    --coral:#E8553F;
    --teal:#3FA796;
    --line: rgba(36,21,54,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, var(--plum-2) 0%, var(--plum) 45%),
      var(--plum);
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
  }
  .wrap{
    width:100%;
    max-width:480px;
    padding:28px 20px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
  }
  header{
    width:100%;
    text-align:center;
    margin-bottom:6px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--mustard);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(28px,7vw,36px);
    margin:0;
    line-height:1.05;
  }
  h1 em{
    font-style:italic;
    font-weight:600;
    color:var(--mustard);
  }
  .sub{
    margin-top:8px;
    font-size:13.5px;
    color:rgba(245,239,226,0.65);
    max-width:340px;
  }
  .progress-row{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0 18px;
  }
  .progress-track{
    flex:1;
    height:5px;
    background:rgba(245,239,226,0.15);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--mustard);
    border-radius:4px;
    transition:width .35s ease;
  }
  .progress-count{
    font-size:12px;
    color:rgba(245,239,226,0.55);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
  }

  .stage{
    position:relative;
    width:100%;
    height:300px;
    margin-bottom:26px;
  }
  .card{
    position:absolute;
    inset:0;
    border-radius:18px;
    background:var(--paper);
    color:var(--ink);
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:34px 28px;
    text-align:center;
  }
  .card.behind-1{
    transform: translateY(10px) scale(0.96) rotate(-2deg);
    background:var(--paper-2);
    z-index:1;
  }
  .card.behind-2{
    transform: translateY(18px) scale(0.92) rotate(2deg);
    background:var(--paper-2);
    opacity:0.7;
    z-index:0;
  }
  .card.top{
    z-index:2;
    transition: transform .28s ease, opacity .28s ease;
  }
  .card.top.leave-like{
    transform: translateX(140%) rotate(14deg);
    opacity:0;
  }
  .card.top.leave-dislike{
    transform: translateX(-140%) rotate(-14deg);
    opacity:0;
  }
  .card.top.enter{
    animation: cardIn .3s ease;
  }
  @keyframes cardIn{
    from{ transform: translateY(14px) scale(0.97); opacity:0; }
    to{ transform: translateY(0) scale(1); opacity:1; }
  }
  .card-index{
    position:absolute;
    top:16px;
    left:18px;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:rgba(36,21,54,0.4);
    font-weight:700;
  }
  .card-text{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(20px,5.2vw,25px);
    line-height:1.3;
  }
  .finger{
    position:absolute;
    bottom:14px;
    right:18px;
    font-size:20px;
    opacity:0.5;
  }

  .actions{
    width:100%;
    display:flex;
    gap:14px;
    margin-bottom:8px;
  }
  button.choice{
    flex:1;
    border:none;
    border-radius:14px;
    padding:16px 10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    transition: transform .12s ease, filter .12s ease;
    color:var(--paper);
  }
  button.choice:active{ transform: scale(0.96); }
  .btn-dislike{ background:var(--coral); }
  .btn-like{ background:var(--teal); }
  .btn-icon{ font-size:22px; }

  .skip-row{
    width:100%;
    text-align:center;
    margin-top:4px;
  }
  .link-btn{
    background:none;
    border:none;
    color:rgba(245,239,226,0.55);
    font-family:'Space Grotesk', sans-serif;
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:6px;
  }

  .done{
    width:100%;
    text-align:center;
    padding:50px 10px 20px;
  }
  .done h2{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:26px;
    margin-bottom:8px;
  }
  .done p{
    color:rgba(245,239,226,0.65);
    font-size:14px;
    margin-bottom:24px;
  }
  .restart-btn{
    background:var(--mustard);
    color:var(--plum);
    border:none;
    border-radius:12px;
    padding:14px 26px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }

  /* Menú principal */
  .menu-header{
    text-align:center;
    margin-bottom:34px;
  }
  .menu-list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .game-card{
    width:100%;
    background:var(--paper);
    color:var(--ink);
    border:none;
    border-radius:16px;
    padding:20px 20px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:16px;
    box-shadow: 0 14px 28px rgba(0,0,0,0.25);
    transition: transform .12s ease;
  }
  .game-card:active{ transform: scale(0.97); }
  .game-emoji{
    font-size:30px;
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .game-card.probable .game-emoji{ background:rgba(63,167,150,0.18); }
  .game-card.song .game-emoji{ background:rgba(232,85,63,0.15); }
  .game-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:18px;
    margin-bottom:3px;
  }
  .game-desc{
    font-size:12.5px;
    color:rgba(36,21,54,0.6);
    line-height:1.35;
  }
  .top-back{
    align-self:flex-start;
    background:none;
    border:1px solid rgba(245,239,226,0.3);
    color:var(--paper);
    border-radius:20px;
    padding:6px 14px;
    font-size:12px;
    cursor:pointer;
    margin-bottom:18px;
  }

  /* Canta la palabra */
  .word-stage{
    width:100%;
    background:var(--paper);
    border-radius:20px;
    padding:46px 24px;
    text-align:center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .word-stage::before{
    content:"♪";
    position:absolute;
    top:-10px;
    right:10px;
    font-size:90px;
    color:rgba(232,85,63,0.08);
  }
  .word-label{
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--coral);
    font-weight:700;
    margin-bottom:10px;
  }
  .word-text{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(34px,10vw,48px);
    color:var(--ink);
    line-height:1.1;
  }
  .next-word-btn{
    width:100%;
    background:var(--coral);
    color:var(--paper);
    border:none;
    border-radius:14px;
    padding:18px 10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    margin-bottom:26px;
    transition: transform .12s ease;
  }
  .next-word-btn:active{ transform: scale(0.97); }

  .scoreboard{
    width:100%;
  }
  .scoreboard-title{
    font-family:'Fraunces', serif;
    font-size:16px;
    margin-bottom:10px;
    color:rgba(245,239,226,0.85);
  }
  .player-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(245,239,226,0.08);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:8px;
  }
  .player-name{
    flex:1;
    font-size:14px;
    font-weight:500;
  }
  .player-score{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:18px;
    color:var(--mustard);
    min-width:22px;
    text-align:center;
  }
  .score-btn{
    width:28px;
    height:28px;
    border-radius:50%;
    border:none;
    background:rgba(245,239,226,0.15);
    color:var(--paper);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .score-btn:active{ transform: scale(0.9); }
  .remove-player{
    background:none;
    border:none;
    color:rgba(245,239,226,0.35);
    font-size:15px;
    cursor:pointer;
    padding:2px 4px;
  }
  .add-player-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .add-player-row input{
    flex:1;
    background:rgba(245,239,226,0.08);
    border:1px solid rgba(245,239,226,0.2);
    border-radius:10px;
    padding:10px 12px;
    color:var(--paper);
    font-family:'Space Grotesk', sans-serif;
    font-size:14px;
  }
  .add-player-row input::placeholder{ color:rgba(245,239,226,0.4); }
  .add-player-row button{
    background:var(--mustard);
    color:var(--plum);
    border:none;
    border-radius:10px;
    padding:0 18px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .empty-players{
    color:rgba(245,239,226,0.45);
    font-size:12.5px;
    padding:6px 2px 4px;
  }

  /* Contador */
  .citadels-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper);
    color:var(--ink);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow: 0 10px 22px rgba(0,0,0,0.2);
  }
  .citadels-name{
    flex:1;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:16px;
  }
  .citadels-score{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:26px;
    min-width:38px;
    text-align:center;
    color:var(--plum);
  }
  .citadels-arrows{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .arrow-btn{
    width:34px;
    height:26px;
    border:none;
    border-radius:8px;
    background:var(--paper-2);
    color:var(--plum);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .arrow-btn.up{ background:rgba(63,167,150,0.18); color:var(--teal); }
  .arrow-btn.down{ background:rgba(232,85,63,0.14); color:var(--coral); }
  .arrow-btn:active{ transform: scale(0.9); }
  .citadels-remove{
    background:none;
    border:none;
    color:rgba(36,21,54,0.3);
    font-size:15px;
    cursor:pointer;
    padding:2px 2px 2px 6px;
  }
  .citadels-reset{
    width:100%;
    background:rgba(245,239,226,0.1);
    border:1px solid rgba(245,239,226,0.25);
    color:var(--paper);
    border-radius:12px;
    padding:12px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    margin-top:16px;
  }

  /* Trivial */
  .frase-hint{
    text-align:center;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--coral);
    font-weight:700;
    margin:18px 0 6px;
  }
  .frase-display{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    margin-bottom:18px;
  }
  .frase-letter-box{
    width:26px;
    height:34px;
    border-bottom:3px solid var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:19px;
    color:var(--paper);
  }
  .frase-letter-box.space{ border-bottom:none; width:14px; }
  .frase-status{
    text-align:center;
    font-size:12.5px;
    color:rgba(245,239,226,0.6);
    margin-bottom:14px;
  }
  .frase-letter-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:6px;
    margin-bottom:20px;
  }
  .frase-letter-btn{
    aspect-ratio:1/1;
    border-radius:8px;
    border:none;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .frase-letter-btn:disabled{
    opacity:0.3;
    cursor:default;
  }
  .frase-letter-btn.hit{
    background:var(--teal);
    color:#fff;
  }
  .frase-letter-btn.miss{
    background:rgba(245,239,226,0.15);
    color:rgba(245,239,226,0.4);
  }
  .rosco-timer{
    text-align:center;
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:38px;
    color:var(--mustard);
    margin:10px 0 4px;
  }
  .rosco-progress{
    text-align:center;
    font-size:12.5px;
    color:rgba(245,239,226,0.6);
    margin-bottom:16px;
  }
  .rosco-column{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:18px;
    max-height:34vh;
    overflow-y:auto;
  }
  .rosco-col-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper);
    border-radius:10px;
    padding:8px 12px;
    border:2px solid transparent;
  }
  .rosco-col-row.active{
    border-color:var(--mustard);
  }
  .rosco-col-letter{
    width:30px;
    height:30px;
    border-radius:50%;
    background:rgba(36,21,54,0.1);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:14px;
    flex-shrink:0;
  }
  .rosco-col-letter.correct{
    background:var(--teal);
    color:#fff;
  }
  .rosco-col-blank{
    flex:1;
    min-height:20px;
    border-bottom:2px dotted rgba(36,21,54,0.25);
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    color:var(--ink);
    padding-bottom:2px;
  }
  .rosco-col-blank.correct{
    color:var(--teal);
    font-weight:700;
    border-bottom-color:transparent;
  }
  .rosco-col-blank.given-up{
    color:rgba(36,21,54,0.4);
    border-bottom-color:transparent;
  }
  .rosco-answer-input{
    width:100%;
    background:var(--paper-2);
    border:2px solid rgba(36,21,54,0.15);
    border-radius:12px;
    padding:14px 14px;
    font-family:'Space Grotesk', sans-serif;
    font-size:15px;
    color:var(--ink);
    text-align:center;
    text-transform:uppercase;
  }
  .rosco-feedback{
    text-align:center;
    font-size:13px;
    font-weight:700;
    margin-bottom:10px;
  }
  .rosco-feedback.wrong{ color:var(--coral); }
  .cat-progress{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:12px 0 4px;
  }
  .cat-progress-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  .cat-progress-dot{
    width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    background:rgba(245,239,226,0.08);
    opacity:0.4;
    border:1.5px solid rgba(245,239,226,0.25);
  }
  .cat-progress-dot.done{
    opacity:1;
    background:var(--mustard);
    border-color:var(--mustard);
  }
  .cat-progress-score{
    font-size:10.5px;
    font-weight:700;
    color:rgba(245,239,226,0.55);
    font-family:'Space Grotesk', sans-serif;
  }
  .cat-progress-score.done{
    color:var(--mustard);
  }
  .cat-progress.on-light .cat-progress-dot{
    background:rgba(36,21,54,0.06);
    border-color:rgba(36,21,54,0.18);
  }
  .cat-progress.on-light .cat-progress-dot.done{
    background:var(--coral);
    border-color:var(--coral);
  }
  .cat-progress.on-light .cat-progress-score{
    color:rgba(36,21,54,0.5);
  }
  .cat-progress.on-light .cat-progress-score.done{
    color:var(--coral);
  }
  .trivia-roll-btn{
    width:100%;
    background:var(--coral);
    color:#fff;
    border:none;
    border-radius:16px;
    padding:26px 16px;
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:19px;
    cursor:pointer;
    margin-top:26px;
  }
  .final-card{
    background:linear-gradient(135deg, rgba(242,183,5,0.18), rgba(232,85,63,0.12));
    border:2px solid var(--mustard);
    border-radius:18px;
    padding:24px 20px;
    text-align:center;
    margin-top:16px;
  }
  .final-card p{
    color:var(--paper);
    font-size:14px;
    line-height:1.5;
    margin-bottom:18px;
  }
  .victory-card{
    text-align:center;
    padding:30px 10px 10px;
  }
  .victory-card .trophy{
    font-size:56px;
    margin-bottom:10px;
  }
  .trivia-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:22px;
  }
  .trivia-cat-btn{
    background:var(--paper);
    color:var(--ink);
    border:none;
    border-radius:16px;
    padding:20px 10px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(0,0,0,0.22);
  }
  .trivia-cat-btn .emoji{
    font-size:30px;
    display:block;
    margin-bottom:8px;
  }
  .trivia-cat-btn .label{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:14.5px;
  }
  .trivia-diff-row{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:22px;
  }
  .trivia-diff-btn{
    border:none;
    border-radius:14px;
    padding:18px 16px;
    text-align:left;
    cursor:pointer;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Space Grotesk', sans-serif;
  }
  .trivia-diff-btn .diff-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:17px;
  }
  .trivia-diff-btn .diff-points{
    font-size:13px;
    opacity:0.9;
    font-weight:700;
  }
  .trivia-turn-badge{
    text-align:center;
    font-size:13px;
    color:var(--mustard);
    font-weight:700;
    margin-bottom:4px;
  }
  .trivia-answer-box{
    background:rgba(63,167,150,0.15);
    border:1.5px dashed var(--teal);
    border-radius:12px;
    padding:14px 16px;
    margin:16px 0;
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px;
    color:var(--ink);
  }
  .trivia-answer-label{
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(36,21,54,0.5);
    margin-bottom:4px;
  }
  .trivia-judge-row{

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// --- Persistencia local (por móvil, no compartida entre dispositivos) ---
function lsGet(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){
    return fallback;
  }
}
function lsSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
  }catch(e){
    console.error('No se pudo guardar en este dispositivo', e);
  }
}

// --- Roster global de jugadores (compartido entre todos los juegos) ---
const GLOBAL_PLAYERS_KEY = 'jg_global_players';
function loadGlobalPlayers(){
  return lsGet(GLOBAL_PLAYERS_KEY, []);
}
function addToGlobalRoster(name){
  const list = loadGlobalPlayers();
  if(!list.includes(name)){
    list.push(name);
    lsSet(GLOBAL_PLAYERS_KEY, list);
  }
}
function removeFromGlobalRoster(name){
  lsSet(GLOBAL_PLAYERS_KEY, loadGlobalPlayers().filter(n => n !== name));
}
function globalRosterChipsHtml(excludeNames){
  const list = loadGlobalPlayers().filter(n => !excludeNames.includes(n));
  if(!list.length) return '';
  return `
    <div class="roster-chips" id="rosterChips">
      ${list.map(n => `<button class="roster-chip" data-name="${escapeHtml(n)}">+ ${escapeHtml(n)}</button>`).join('')}
    </div>
  `;
}
function wireRosterChips(onPick){
  const container = document.getElementById('rosterChips');
  if(!container) return;
  container.querySelectorAll('.roster-chip').forEach(btn => {
    btn.onclick = () => onPick(btn.dataset.name);
  });
}

function loadLiked(){

function choose(type){
  const q = state.deck[state.index];
  state.animClass = type === 'like' ? 'leave-like' : 'leave-dislike';
  render();

  setTimeout(() => {
    if(type === 'like'){
      state.liked.push(q);
      saveLiked();
    }
    state.index += 1;
    state.animClass = 'enter';
    if(state.index >= state.deck.length){
      state.view = 'done';
    }
    render();
  }, 260);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
function normalizeAnswerText(str){
  return (str || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quita tildes
    .replace(/\s+/g, ' ')
    .trim()
    .toUpperCase();
}

// --- Confirmación propia dentro de la app ---
// No usamos window.confirm(): en modo "añadido a pantalla de inicio" (PWA
// standalone) muchos navegadores lo bloquean sin avisar, y el botón parece
// no hacer nada. Este modal vive fuera de #app para sobrevivir a cualquier
// render() de la pantalla que esté debajo.
let confirmModalState = null; // { message, onConfirm }
function showConfirm(message, onConfirm){
  confirmModalState = { message, onConfirm };
  renderConfirmModal();
}
function renderConfirmModal(){
  let modalEl = document.getElementById('confirmModalOverlay');
  if(!confirmModalState){
    if(modalEl) modalEl.remove();
    return;
  }
  if(!modalEl){
    modalEl = document.createElement('div');
    modalEl.id = 'confirmModalOverlay';
    modalEl.className = 'confirm-modal-overlay';
    document.body.appendChild(modalEl);
  }
  modalEl.innerHTML = `
    <div class="confirm-modal-box">
      <p>${escapeHtml(confirmModalState.message)}</p>
      <div class="confirm-modal-actions">
        <button id="confirmModalCancel">Cancelar</button>
        <button id="confirmModalOk">Sí, continuar</button>
      </div>
    </div>
  `;
  document.getElementById('confirmModalCancel').onclick = () => {
    confirmModalState = null;
    renderConfirmModal();
  };
  document.getElementById('confirmModalOk').onclick = () => {
    const cb = confirmModalState.onConfirm;
    confirmModalState = null;
    renderConfirmModal();
    cb();
  };
}

function updateTriviaScoreFab(){
  const shouldShow = state.screen === 'trivia' && state.trivia.phase !== 'leaderboard';
  let fab = document.getElementById('triviaScoreFab');
  if(!shouldShow){
    if(fab) fab.remove();
    return;
  }
  if(!fab){
    fab = document.createElement('button');
    fab.id = 'triviaScoreFab';
    fab.className = 'trivia-score-fab';
    fab.onclick = () => viewTriviaLeaderboard();
    document.body.appendChild(fab);
  }
  const me = state.trivia.players[state.trivia.turnIndex];
  fab.textContent = '🏆' + (me ? ' ' + me.score : '');
}

// Traduce el nivel que ve el jugador (normal/dificil) al nivel de contenido
// real, según el ajuste de dificultad de la partida elegido en "¿Quién juega?".
function resolveContentTier(uiDiff){
  const gameDiff = state.trivia.gameDifficulty || 'normal';
  if(gameDiff === 'normal'){
    return uiDiff === 'normal' ? 'normal' : 'dificil';
  }
  return uiDiff === 'normal' ? 'dificil' : 'muy_dificil';
}
function pickTriviaQuestion(cat, diff){
  const tier = resolveContentTier(diff);
  const pool = TRIVIA_CATEGORIES[cat].questions[tier];
  const key = cat + '_' + tier;
  let used = state.trivia.used[key] || [];
  if(used.length >= pool.length) used = []; // se han usado todas: reciclamos
  const available = pool.map((_,i)=>i).filter(i => !used.includes(i));
  const idx = available[Math.floor(Math.random()*available.length)];
  state.trivia.used[key] = [...used, idx];
  return pool[idx];
}
function startTriviaTurn(){
  const player = state.trivia.players[state.trivia.turnIndex];

function pickFraseLetter(letter){
  const f = state.trivia;
  if(f.fraseUsedLetters.includes(letter) || f.fraseLettersLeft <= 0 || f.fraseRevealed) return;
  f.fraseUsedLetters.push(letter);
  f.fraseLettersLeft -= 1;
  if(f.frasePhrase.includes(letter)){
    f.fraseGuessedLetters.push(letter);
  }
  const allLettersFound = f.frasePhrase.split('').every(ch => ch === ' ' || f.fraseGuessedLetters.includes(ch));
  if(allLettersFound){
    f.fraseRevealed = true;
    resolveConcursoResult(true);
    return;
  }
  // Quedarse sin letras NO hace perder: simplemente ya no se pueden elegir más
  // (el teclado se deshabilita solo). El jugador puede seguir intentando
  // "resolver" escribiendo la frase completa cuando quiera.
  render();
}

// --- Rosco ---
function pickRoscoWords(cat, diff, n){
  const pool = ROSCO_BANK[cat][diff];
  const key = 'rosco_' + cat + '_' + diff;
  let used = state.trivia.used[key] || [];
  if(used.length + n > pool.length) used = []; // no caben suficientes sin repetir: reciclamos
  const availableIdx = pool.map((_,i)=>i).filter(i => !used.includes(i));
  const shuffled = shuffle(availableIdx);

  const chosen = [];
  const usedLetters = new Set();
  for(const idx of shuffled){
    const letter = pool[idx].answer[0];
    if(usedLetters.has(letter)) continue; // no repetir letra inicial en la misma ronda
    usedLetters.add(letter);
    chosen.push(idx);
    if(chosen.length >= n) break;
  }
  // Si no se pudo evitar del todo (pool con letras muy repetidas), rellenamos igualmente
  if(chosen.length < n){
    for(const idx of shuffled){
      if(chosen.includes(idx)) continue;
      chosen.push(idx);
      if(chosen.length >= n) break;
    }
  }
  state.trivia.used[key] = [...used, ...chosen];
  return chosen.map(i => pool[i]);
}
function startRosco(diff){
  const info = TRIVIA_DIFFICULTY[diff];
  const cat = state.trivia.category;
  state.trivia.roscoQueue = pickRoscoWords(cat, diff, info.roscoWords);
  state.trivia.roscoStatus = state.trivia.roscoQueue.map(() => 'pending');
  state.trivia.roscoActiveIndex = 0;
  state.trivia.roscoCorrectCount = 0;
  state.trivia.roscoSecondsLeft = info.roscoSeconds;
  state.trivia.roscoRevealed = false;
  state.trivia.roscoFeedback = null;
  state.trivia.roscoDifficulty = diff;
  state.trivia.phase = 'rosco';
  startRoscoInterval();
}
function startRoscoInterval(){
  clearRoscoTimer();
  if(state.trivia.roscoSecondsLeft <= 0){
    finishRoscoRound();
    return;
  }
  state.trivia.roscoTimerId = setInterval(() => {
    state.trivia.roscoSecondsLeft -= 1;
    if(state.trivia.roscoSecondsLeft <= 0){
      clearRoscoTimer();
      state.trivia.roscoSecondsLeft = 0;
      finishRoscoRound();
      return;
    }
    // No hacemos render() completo cada segundo: eso borraría lo que el
    // jugador está escribiendo y le quitaría el foco. Solo actualizamos
    // el número del cronómetro directamente en el DOM.
    const timerEl = document.getElementById('roscoTimerDisplay');
    if(timerEl){
      timerEl.textContent = Math.floor(state.trivia.roscoSecondsLeft/60) + ':' + String(state.trivia.roscoSecondsLeft%60).padStart(2,'0');
    }
    saveTriviaState();
  }, 1000);
}
function clearRoscoTimer(){
  if(state.trivia.roscoTimerId){
    clearInterval(state.trivia.roscoTimerId);
    state.trivia.roscoTimerId = null;
  }
}
function nextPendingRoscoIndex(fromIndex){
  const n = state.trivia.roscoStatus.length;
  for(let step = 1; step <= n; step++){
    const idx = (fromIndex + step) % n;
    if(state.trivia.roscoStatus[idx] === 'pending') return idx;
  }
  return -1; // no quedan pendientes
}
function advanceRoscoAfterAnswer(){
  const next = nextPendingRoscoIndex(state.trivia.roscoActiveIndex);
  if(next === -1){
    clearRoscoTimer();
    finishRoscoRound();
  } else {
    state.trivia.roscoActiveIndex = next;
    state.trivia.roscoRevealed = false;
    state.trivia.roscoFeedback = null;
    render();
  }
}
function submitRoscoAnswer(){
  const input = document.getElementById('roscoAnswerInput');
  const current = state.trivia.roscoQueue[state.trivia.roscoActiveIndex];
  if(!input || !current) return;
  const typed = normalizeAnswerText(input.value);
  if(!typed) return;
  if(typed === normalizeAnswerText(current.answer)){
    state.trivia.roscoStatus[state.trivia.roscoActiveIndex] = 'correct';
    state.trivia.roscoCorrectCount += 1;
    advanceRoscoAfterAnswer();
  } else {
    state.trivia.roscoFeedback = 'wrong';
    render();
    const freshInput = document.getElementById('roscoAnswerInput');
    if(freshInput) freshInput.focus();
  }
}
function giveUpRosco(){
  state.trivia.roscoRevealed = true;
  state.trivia.roscoFeedback = null;
  render();
}
function continueAfterRoscoReveal(){
  state.trivia.roscoStatus[state.trivia.roscoActiveIndex] = 'given_up';
  advanceRoscoAfterAnswer();
}
function passRoscoWord(){
  const next = nextPendingRoscoIndex(state.trivia.roscoActiveIndex);
  if(next === -1 || next === state.trivia.roscoActiveIndex) return; // no hay otra pendiente
  state.trivia.roscoActiveIndex = next;
  state.trivia.roscoRevealed = false;
  state.trivia.roscoFeedback = null;
  render();
}
function changeRoscoWord(){
  const diff = state.trivia.roscoDifficulty;
  const activeIdx = state.trivia.roscoActiveIndex;
  const replacement = pickRoscoWords(state.trivia.category, diff, 1)[0];
  state.trivia.roscoQueue[activeIdx] = replacement;
  state.trivia.roscoRevealed = false;
  state.trivia.roscoFeedback = null;
  render();
}
function finishRoscoRound(){
  state.trivia.phase = 'roscoResult';
  render();
}
function collectRoscoPoints(){
  const pts = state.trivia.roscoCorrectCount * TRIVIA_DIFFICULTY[state.trivia.roscoDifficulty].points;
  if(state.trivia.roscoCorrectCount > 0){
    advanceAfterConcursoWin(pts, state.trivia.roscoDifficulty);
  } else {
    finishConcursoTurn();
  }
}

// --- Cierre común de prueba en modo Concurso ---
function resolveConcursoResult(correct){
  state.trivia.phase = 'concursoResult';
  state.trivia.lastConcursoCorrect = correct;
  render();
}
function collectConcursoPoints(){
  if(state.trivia.lastConcursoCorrect){
    advanceAfterConcursoWin(TRIVIA_DIFFICULTY[state.trivia.difficulty].points, state.trivia.difficulty);
  } else {
    finishConcursoTurn();
  }
}
// Suma los puntos a la puntuación total Y al quesito de la categoría elegida,
// exactamente igual que en el modo Clásico.
function awardConcursoCategoryPoints(points){
  const player = state.trivia.players[state.trivia.turnIndex];
  if(!player) return false;
  ensureTriviaCategoryScores(player);
  const cat = state.trivia.category;
  player.score += points;
  if(cat && player.categoryScores[cat] !== undefined) player.categoryScores[cat] += points;
  saveTriviaPlayers();
  return triviaPlayerComplete(player);
}
// Tras acertar en Concurso: suma puntos, y si completa las categorías pasa a
// la pregunta final; si no, si era difícil elige categoría libremente (igual
// que en Clásico), y si no, vuelve a sortear 2 categorías nuevas.
function advanceAfterConcursoWin(points, diffKey){
  const complete = awardConcursoCategoryPoints(points);
  if(complete){
    state.trivia.phase = 'finalReady';
  } else if(diffKey === 'dificil'){
    state.trivia.categoryChoices = Object.keys(TRIVIA_CATEGORIES);
    state.trivia.phase = 'concursoCategory';
  } else {
    rollConcursoCategories();
  }
  render();
}
function finishConcursoTurn(){
  clearRoscoTimer();
  state.trivia.turnIndex = state.trivia.players.length ? (state.trivia.turnIndex + 1) % state.trivia.players.length : 0;
  startTriviaTurn();
  render();
}

function rollTriviaCategories(){
  state.trivia.categoryChoices = shuffle(Object.keys(TRIVIA_CATEGORIES)).slice(0, 2);
  state.trivia.phase = 'category';
}
function selectTriviaCategory(catId){
  state.trivia.category = catId;
  state.trivia.phase = 'difficulty';
  render();
}
function backToTriviaCategory(){
  state.trivia.category = null;
  state.trivia.difficulty = null;
  state.trivia.phase = 'category';
  render();
}
function selectTriviaDifficulty(diff){
  const cat = state.trivia.category;
  state.trivia.difficulty = diff;
  state.trivia.currentQuestion = pickTriviaQuestion(cat, diff);
  state.trivia.revealed = false;
  state.trivia.phase = 'question';
  render();
}
function revealTriviaAnswer(){
  state.trivia.revealed = true;
  render();
}
function answerTrivia(correct){
  const player = state.trivia.players[state.trivia.turnIndex];
  const diff = state.trivia.difficulty;
  const cat = state.trivia.category;

  if(state.trivia.mode === 'concurso'){
    if(correct){
      advanceAfterConcursoWin(TRIVIA_DIFFICULTY[diff].points, diff);
    } else {
      finishConcursoTurn();
    }
    return;
  }

  if(correct && player){
    ensureTriviaCategoryScores(player);
    const pts = TRIVIA_DIFFICULTY[diff].points;
    player.score += pts;
    player.categoryScores[cat] += pts;
    saveTriviaPlayers();

    state.trivia.category = null;
    state.trivia.difficulty = null;
    state.trivia.currentQuestion = null;
    state.trivia.revealed = false;

    if(triviaPlayerComplete(player)){
      state.trivia.phase = 'finalReady';
    } else if(diff === 'dificil'){
      // Acertar la difícil premia con elegir la próxima categoría libremente
      state.trivia.categoryChoices = Object.keys(TRIVIA_CATEGORIES);
      state.trivia.phase = 'category';
    } else {
      rollTriviaCategories();
    }
  } else {
    // Fallo: pasa el turno al siguiente jugador
    state.trivia.turnIndex = state.trivia.players.length ? (state.trivia.turnIndex + 1) % state.trivia.players.length : 0;
    startTriviaTurn();
  }
  render();
}
function drawTriviaFinalQuestion(){
  const catIds = Object.keys(TRIVIA_CATEGORIES);
  const cat = catIds[Math.floor(Math.random()*catIds.length)];
  state.trivia.category = cat;
  state.trivia.difficulty = 'dificil';
  state.trivia.currentQuestion = pickTriviaQuestion(cat, 'dificil');
  state.trivia.revealed = false;
  state.trivia.phase = 'finalQuestion';
  render();
}
function answerTriviaFinal(correct){
  state.trivia.category = null;
  state.trivia.difficulty = null;
  state.trivia.currentQuestion = null;
  state.trivia.revealed = false;
  if(correct){
    state.trivia.phase = 'victory';
  } else {
    state.trivia.turnIndex = state.trivia.players.length ? (state.trivia.turnIndex + 1) % state.trivia.players.length : 0;
    startTriviaTurn();
  }
  render();
}
function triviaNewGameAfterVictory(){
  state.trivia.players.forEach(p => { p.score = 0; p.categoryScores = {}; ensureTriviaCategoryScores(p); });
  saveTriviaPlayers();
  state.trivia.turnIndex = 0;
  startTriviaTurn();
  render();
}
function triviaKeepPlayingAfterVictory(){
  state.trivia.turnIndex = state.trivia.players.length ? (state.trivia.turnIndex + 1) % state.trivia.players.length : 0;
  startTriviaTurn();

}

function attachFingersHandlers(){
  const layer = document.getElementById('touchLayer');
  if(!layer) return;
  const svg = document.getElementById('linesSvg');
  const SVG_NS = 'http://www.w3.org/2000/svg';
  let lines = []; // { id1, id2, el }
  const myGen = ++state.fingers.generation;

  function relPos(clientX, clientY){
    const rect = layer.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function addCircle(id, x, y){
    const el = document.createElement('div');
    el.className = 'finger-circle pulse';
    el.textContent = '•';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    layer.appendChild(el);
    state.fingers.touches.set(id, { el, x, y });
    updateStatusText();
    maybeStartCountdown();
  }

  function moveCircle(id, x, y){
    const t = state.fingers.touches.get(id);
    if(!t) return;
    t.x = x; t.y = y;
    t.el.style.left = x + 'px';
    t.el.style.top = y + 'px';
    lines.forEach(line => {
      if(line.id1 === id) { line.el.setAttribute('x1', x); line.el.setAttribute('y1', y); }
      if(line.id2 === id) { line.el.setAttribute('x2', x); line.el.setAttribute('y2', y); }
    });
  }

  function removeCircle(id){
    const t = state.fingers.touches.get(id);
    if(!t) return;

    if(state.fingers.phase === 'result'){
      // Al levantar el dedo tras el sorteo, se mantiene visible unos segundos
      setTimeout(() => {
        if(myGen !== state.fingers.generation) return;
        if(!state.fingers.touches.has(id)) return;
        t.el.classList.add('fading');
        lines.forEach(line => {
          if(line.id1 === id || line.id2 === id){
            line.el.style.transition = 'opacity .45s ease';
            line.el.style.opacity = '0';
          }
        });
        setTimeout(() => {
          if(myGen !== state.fingers.generation) return;
          t.el.remove();
          state.fingers.touches.delete(id);
          lines = lines.filter(line => {
            if(line.id1 === id || line.id2 === id){
              line.el.remove();
              return false;
            }
            return true;
          });
        }, 450);
      }, 3500);
      return;
    }

    t.el.remove();
    state.fingers.touches.delete(id);
    lines = lines.filter(line => {
      if(line.id1 === id || line.id2 === id){
        line.el.remove();
        return false;
      }
      return true;
    });
    updateStatusText();
    maybeStartCountdown();
  }

  function updateStatusText(){
    const statusEl = document.getElementById('fingerStatus');
    if(!statusEl) return;
    const n = state.fingers.touches.size;
    if(state.fingers.phase === 'result') return;
    statusEl.textContent = n === 0
      ? 'Poned el dedo en la pantalla'
      : (n === 1 ? '1 dedo puesto' : n + ' dedos puestos');
  }

  function maybeStartCountdown(){
    if(state.fingers.phase !== 'placing') return;
    const n = state.fingers.touches.size;
    const overlay = document.getElementById('countdownOverlay');
    if(n >= 2){
      clearFingersCountdown();
      state.fingers.countdownValue = 3;
      if(overlay){ overlay.style.display = 'block'; overlay.textContent = 'Sorteando en 3…'; }
      state.fingers.countdownTimer = setInterval(() => {
        state.fingers.countdownValue -= 1;
        if(state.fingers.countdownValue <= 0){
          clearFingersCountdown();
          finishFingersAssignment();
        } else if(overlay){
          overlay.textContent = 'Sorteando en ' + state.fingers.countdownValue + '…';
        }
      }, 1000);
    } else {
      clearFingersCountdown();
      if(overlay) overlay.style.display = 'none';
    }
  }

  function finishFingersAssignment(){
    const ids = Array.from(state.fingers.touches.keys()); // orden de colocación
    const snapshot = [];

    if(state.fingers.mode === 'pick'){
      const pickCount = Math.min(state.fingers.pickCount, ids.length);
      const chosenSet = new Set(shuffle(ids).slice(0, pickCount));
      const chosenColor = GROUP_COLORS[2].bg; // mostaza
      const restColor = 'rgba(245,239,226,0.28)';

      ids.forEach(id => {
        const chosen = chosenSet.has(id);
        const t = state.fingers.touches.get(id);
        const color = chosen ? chosenColor : restColor;
        if(t){
          t.el.classList.remove('pulse');
          t.el.style.background = color;
          t.el.style.borderColor = color;
          t.el.textContent = chosen ? '★' : '—';
        }
        snapshot.push({ id, color, label: chosen ? 'Elegido/a' : 'No elegido/a', name:'' });
      });

      // Une con una línea a todos los elegidos entre sí
      const chosenIds = ids.filter(id => chosenSet.has(id));
      if(chosenIds.length >= 2){
        for(let k = 0; k < chosenIds.length - 1; k++){
          const id1 = chosenIds[k], id2 = chosenIds[k+1];
          const t1 = state.fingers.touches.get(id1), t2 = state.fingers.touches.get(id2);
          if(!t1 || !t2) continue;
          const lineEl = document.createElementNS(SVG_NS, 'line');
          lineEl.setAttribute('x1', t1.x); lineEl.setAttribute('y1', t1.y);
          lineEl.setAttribute('x2', t2.x); lineEl.setAttribute('y2', t2.y);
          lineEl.setAttribute('stroke', chosenColor);
          lineEl.setAttribute('stroke-width', '6');
          lineEl.setAttribute('stroke-linecap', 'round');
          lineEl.setAttribute('opacity', '0.85');
          svg.appendChild(lineEl);
          lines.push({ id1, id2, el: lineEl });
        }
      }

      state.fingers.phase = 'result';
      const overlay = document.getElementById('countdownOverlay');
      if(overlay) overlay.style.display = 'none';
      const statusEl = document.getElementById('fingerStatus');
      if(statusEl) statusEl.textContent = '¡Elegidos!';
      const hintEl = document.getElementById('fingerHint');
      if(hintEl) hintEl.textContent = 'Podéis levantar los dedos.';

      const legend = document.getElementById('legendPanel');
      if(legend){
        legend.style.display = 'block';
        const list = document.getElementById('legendList');
        list.innerHTML = `
          <div class="legend-item"><span class="legend-swatch" style="background:${chosenColor}"></span>Elegidos: ${chosenIds.length}</div>
          <div class="legend-item"><span class="legend-swatch" style="background:${restColor}"></span>No elegidos: ${ids.length - chosenIds.length}</div>
        `;
      }
      return;
    }

    // ---- modo grupos ----
    const groupCount = state.fingers.groupCount;
    const leaderCount = Math.min(state.fingers.leaderCount, groupCount, ids.length);

    const leaderIds = ids.slice(0, leaderCount);
    const restIds = shuffle(ids.slice(leaderCount));

    const assignment = new Map(); // id -> groupIdx

    // Las personas principales van a grupos distintos entre sí, en orden aleatorio
    const groupSlotsForLeaders = shuffle(Array.from({ length: groupCount }, (_, i) => i)).slice(0, leaderCount);
    leaderIds.forEach((id, i) => assignment.set(id, groupSlotsForLeaders[i]));

    // El resto se reparte al azar y de forma equilibrada entre todos los grupos
    restIds.forEach((id, idx) => assignment.set(id, idx % groupCount));

    const counts = new Array(groupCount).fill(0);
    const buckets = Array.from({ length: groupCount }, () => []);
    const leaderIdSet = new Set(leaderIds);

    ids.forEach(id => {
      const groupIdx = assignment.get(id);
      counts[groupIdx] += 1;
      buckets[groupIdx].push(id);
      const t = state.fingers.touches.get(id);
      const color = GROUP_COLORS[groupIdx % GROUP_COLORS.length];
      const isLeader = leaderIdSet.has(id);
      if(t){
        t.el.classList.remove('pulse');
        t.el.style.background = color.bg;
        t.el.style.borderColor = color.bg;
        t.el.textContent = (isLeader ? '★' : '') + (groupIdx + 1);
      }
      snapshot.push({ id, color: color.bg, label: (isLeader ? '★ ' : '') + 'Grupo ' + (groupIdx + 1), name:'' });
    });

    // Dibuja una línea uniendo, en cadena, a todos los dedos del mismo grupo
    buckets.forEach((bucket, groupIdx) => {
      if(bucket.length < 2) return;
      const color = GROUP_COLORS[groupIdx % GROUP_COLORS.length];
      for(let k = 0; k < bucket.length - 1; k++){
        const id1 = bucket[k];
        const id2 = bucket[k+1];
        const t1 = state.fingers.touches.get(id1);
        const t2 = state.fingers.touches.get(id2);
        if(!t1 || !t2) continue;
        const lineEl = document.createElementNS(SVG_NS, 'line');
        lineEl.setAttribute('x1', t1.x);
        lineEl.setAttribute('y1', t1.y);
        lineEl.setAttribute('x2', t2.x);
        lineEl.setAttribute('y2', t2.y);
        lineEl.setAttribute('stroke', color.bg);
        lineEl.setAttribute('stroke-width', '6');
        lineEl.setAttribute('stroke-linecap', 'round');
        lineEl.setAttribute('opacity', '0.85');
        svg.appendChild(lineEl);
        lines.push({ id1, id2, el: lineEl });
      }
    });

    state.fingers.phase = 'result';

    const overlay = document.getElementById('countdownOverlay');
    if(overlay) overlay.style.display = 'none';

    const statusEl = document.getElementById('fingerStatus');
    if(statusEl) statusEl.textContent = '¡Grupos listos!';
    const hintEl = document.getElementById('fingerHint');
    if(hintEl) hintEl.textContent = 'Podéis levantar los dedos.';

    const legend = document.getElementById('legendPanel');
    if(legend){
      legend.style.display = 'block';
      const list = document.getElementById('legendList');
      list.innerHTML = counts.map((c, i) => `
        <div class="legend-item">
          <span class="legend-swatch" style="background:${GROUP_COLORS[i % GROUP_COLORS.length].bg}"></span>
          Grupo ${i+1}: ${c}
        </div>
      `).join('');
    }
  }

  function onStart(e){
    e.preventDefault();
    for(const touch of e.changedTouches){
      const { x, y } = relPos(touch.clientX, touch.clientY);
      addCircle(touch.identifier, x, y);
    }
  }
  function onMove(e){
    e.preventDefault();
    for(const touch of e.changedTouches){
      const { x, y } = relPos(touch.clientX, touch.clientY);
      moveCircle(touch.identifier, x, y);
    }
  }
  function onEnd(e){
    e.preventDefault();
    for(const touch of e.changedTouches){
      removeCircle(touch.identifier);
    }
  }

  layer.addEventListener('touchstart', onStart, { passive:false });
  layer.addEventListener('touchmove', onMove, { passive:false });
  layer.addEventListener('touchend', onEnd, { passive:false });
  layer.addEventListener('touchcancel', onEnd, { passive:false });
}

function quizSummaryText(sortedPlayers, testLabel, mode){
  const n = sortedPlayers.length;
  if(n === 0) return '';
  const top = sortedPlayers[0];
  const bottom = sortedPlayers[n-1];
  const avg = Math.round(sortedPlayers.reduce((a,p)=>a+p.percent,0) / n);

  if(n === 1){
    return mode === 'gracioso'
      ? `${top.name} juega en solitario con un ${top.percent}% — "${top.title}". De momento nadie le hace sombra… porque nadie más ha jugado todavía 👀. Añadid más gente para comparar.`
      : `${top.name} ha obtenido un ${top.percent}% (${top.title}) en "${testLabel}". Añade más jugadores para poder comparar resultados.`;
  }

  const spread = top.percent - bottom.percent;

  if(mode === 'gracioso'){
    return `👑 ${top.name} se corona con un ${top.percent}% — oficialmente "${top.title}". Mientras tanto, ${bottom.name} aterriza con un discreto ${bottom.percent}%, instalado/a en "${bottom.title}". Entre los dos hay ${spread} puntos de diferencia, casi universos distintos. Media del grupo: ${avg}%.`;
  }
  return `En "${testLabel}" han jugado ${n} personas. La media del grupo es ${avg}%. La puntuación más alta es de ${top.name} con ${top.percent}% (${top.title}), y la más baja es de ${bottom.name} con ${bottom.percent}% (${bottom.title}). Diferencia entre ambos: ${spread} puntos porcentuales.`;
}

function sciSummaryText(players, mode){
  const n = players.length;
  if(n === 0) return '';
  const avgA = Math.round(players.reduce((a,p)=>a+p.aPercent,0) / n);
  const avgC = Math.round(players.reduce((a,p)=>a+p.cPercent,0) / n);
  const topA = [...players].sort((a,b)=>b.aPercent-a.aPercent)[0];
  const topC = [...players].sort((a,b)=>b.cPercent-a.cPercent)[0];

  const counts = {};
  players.forEach(p => { counts[p.title] = (counts[p.title]||0) + 1; });
  const countsText = Object.entries(counts).map(([title,c]) => `${c} ${title}`).join(', ');

  if(n === 1){
    const p = players[0];
    return mode === 'gracioso'
      ? `${p.name} anda solo/a en esto: ${p.aPercent}% de Agencia y ${p.cPercent}% de Comunión — "${p.title}". Traed a alguien más para poder compararlo con algo.`
      : `${p.name} obtuvo ${p.aPercent}% en Agencia y ${p.cPercent}% en Comunión (${p.title}). Añade más jugadores para comparar.`;
  }

  if(mode === 'gracioso'){
    return `🎯 Medalla de Agencia para ${topA.name} (${topA.aPercent}%) — el/la que se lanza sin mirar atrás. 💛 Medalla de Comunión para ${topC.name} (${topC.cPercent}%) — el hombro sobre el que llora todo el grupo. Media general: ${avgA}% Agencia / ${avgC}% Comunión. Reparto de perfiles: ${countsText}.`;
  }
  return `Media del grupo: ${avgA}% en Agencia y ${avgC}% en Comunión. ${topA.name} lidera en Agencia (${topA.aPercent}%). ${topC.name} lidera en Comunión (${topC.cPercent}%). Perfiles presentes en el grupo: ${countsText}.`;
}

        <div class="trivia-turn-badge">Turno de ${currentPlayer ? escapeHtml(currentPlayer.name) : '—'}</div>
        <h1>${info.emoji} ${info.label}</h1>
        <div class="sub">Elige la dificultad. ${t.pruebaType === 'rosco' ? 'Determina cuántas palabras y cuánto tiempo tenéis.' : t.pruebaType === 'frase' ? 'Determina la longitud de la frase a adivinar.' : 'Más difícil, más puntos si aciertas.'}</div>
      </header>
      <div class="trivia-diff-row">
        ${Object.entries(diffSource).map(([id, d]) => `
          <button class="trivia-diff-btn" data-diff="${id}" style="background:${d.color};">
            <span class="diff-name">${d.label}</span>
            <span class="diff-points">${t.pruebaType === 'rosco' ? d.roscoWords + ' palabras · ' + d.roscoSeconds + 's' : '+' + d.points + ' pt' + (d.points===1?'':'s')}</span>
          </button>
        `).join('')}
      </div>
      <div style="text-align:center; margin-top:20px;">
        <button class="saved-toggle" id="backPruebaBtn">← Cambiar prueba</button>
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    const backPruebaBtn = document.getElementById('backPruebaBtn');
    if(backPruebaBtn) backPruebaBtn.onclick = () => { state.trivia.phase = 'pruebaChoice'; render(); };
    app.querySelectorAll('[data-diff]').forEach(btn => {
      btn.onclick = () => selectConcursoDifficulty(btn.dataset.diff);
    });
    return;
  }

  if(t.phase === 'frase'){
    const chars = t.frasePhrase.split('');
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="trivia-turn-badge">Turno de ${currentPlayer ? escapeHtml(currentPlayer.name) : '—'} · ${TRIVIA_DIFFICULTY[t.difficulty].label}</div>
        <h1>🎡 Frase oculta</h1>
      </header>
      <div class="frase-hint">Pista: ${escapeHtml(t.fraseHint)}</div>
      <div class="frase-display">
        ${chars.map(ch => ch === ' '
          ? `<div class="frase-letter-box space"></div>`
          : `<div class="frase-letter-box">${(t.fraseGuessedLetters.includes(ch) || t.fraseRevealed) ? escapeHtml(ch) : ''}</div>`
        ).join('')}
      </div>
      <div class="frase-status">${t.fraseLettersLeft > 0 ? `Letras restantes: ${t.fraseLettersLeft} / ${loadAppSettings().maxLetters}` : 'Sin letras — pero podéis intentar resolver la frase'}</div>
      ${!t.fraseSolveMode ? `
        <div class="frase-letter-grid">
          ${LETTER_GRID.map(l => {
            const used = t.fraseUsedLetters.includes(l);
            const hit = used && t.frasePhrase.includes(l);
            const miss = used && !t.frasePhrase.includes(l);
            return `<button class="frase-letter-btn ${hit?'hit':''} ${miss?'miss':''}" data-letter="${l}" ${used || t.fraseLettersLeft<=0 ? 'disabled' : ''}>${l}</button>`;
          }).join('')}
        </div>
        <button class="quiz-option" id="resolveFraseBtn" style="text-align:center; font-weight:700;">🙋 Ya sé la frase — resolver</button>
        <div class="quiz-actions" style="margin-top:12px;">
          <button class="quiz-btn-secondary" id="changeFraseBtn">🔄 Cambiar frase</button>
          <button class="quiz-btn-secondary" id="resetTriviaBtn">🏠 Reiniciar partida</button>
        </div>
      ` : `
        <div class="quiz-card">
          <div class="trivia-answer-label">Escribe la frase completa</div>
          ${t.fraseFeedback === 'wrong' ? `<div class="rosco-feedback wrong">❌ No es correcta</div>` : ''}
          <input type="text" id="fraseSolveInput" class="rosco-answer-input" placeholder="Escribe aquí…" autocomplete="off" autocapitalize="off">
          <div class="quiz-actions" style="margin-top:12px;">
            <button class="quiz-btn-secondary" id="cancelSolveBtn">↩️ Cancelar</button>
            <button class="quiz-btn-primary" id="checkFraseBtn">✅ Comprobar</button>
          </div>
        </div>
      `}
    `;
    document.getElementById('backMenu').onclick = goMenu;
    const resolveBtn = document.getElementById('resolveFraseBtn');
    if(resolveBtn) resolveBtn.onclick = startFraseSolveMode;
    const changeFraseBtn = document.getElementById('changeFraseBtn');
    if(changeFraseBtn) changeFraseBtn.onclick = changeFraseOculta;
    const resetBtn1 = document.getElementById('resetTriviaBtn');
    if(resetBtn1) resetBtn1.onclick = resetTriviaGame;
    app.querySelectorAll('.frase-letter-btn').forEach(btn => {
      btn.onclick = () => pickFraseLetter(btn.dataset.letter);
    });
    const cancelBtn = document.getElementById('cancelSolveBtn');
    const checkBtn = document.getElementById('checkFraseBtn');
    const solveInput = document.getElementById('fraseSolveInput');
    if(cancelBtn) cancelBtn.onclick = cancelFraseSolveMode;
    if(checkBtn) checkBtn.onclick = submitFraseAnswer;
    if(solveInput){
      solveInput.focus();
      solveInput.onkeydown = (e) => { if(e.key === 'Enter') submitFraseAnswer(); };
    }
    return;
  }

  if(t.phase === 'sigueLetra'){
    const song = t.sigueLetraSong;
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="trivia-turn-badge">Turno de ${currentPlayer ? escapeHtml(currentPlayer.name) : '—'} · ${TRIVIA_DIFFICULTY[t.difficulty].label}</div>
        <h1>🎤 Sigue la letra</h1>
      </header>
      <div class="quiz-card" style="text-align:center;">
        <div class="quiz-qnum">Canta lo que recuerdes de</div>
        <div class="quiz-qtext">"${escapeHtml(song.title)}"<br><span style="font-size:14px; font-weight:400; color:rgba(36,21,54,0.6);">${escapeHtml(song.artist)}</span></div>
        <div class="trivia-answer-label" style="margin-top:16px;">¿Lo ha conseguido?</div>
        <div class="trivia-judge-row" style="margin-top:10px;">
          <button style="background:var(--coral);" id="failBtn">❌ No</button>
          <button style="background:var(--teal);" id="correctBtn">✅ Sí (+${TRIVIA_DIFFICULTY[t.difficulty].points})</button>
        </div>
      </div>
      <div class="quiz-actions" style="margin-top:14px;">
        <button class="quiz-btn-secondary" id="changeSongBtn">🔄 Cambiar canción</button>
        <button class="quiz-btn-secondary" id="resetTriviaBtn">🏠 Reiniciar partida</button>
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('correctBtn').onclick = () => judgeSigueLetra(true);
    document.getElementById('failBtn').onclick = () => judgeSigueLetra(false);
    document.getElementById('changeSongBtn').onclick = changeSigueLetraSong;
    document.getElementById('resetTriviaBtn').onclick = resetTriviaGame;
    return;
  }

  if(t.phase === 'palabraCanciones'){
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="trivia-turn-badge">Turno de ${currentPlayer ? escapeHtml(currentPlayer.name) : '—'} · ${TRIVIA_DIFFICULTY[t.difficulty].label}</div>
        <h1>🎶 Palabra y canciones</h1>
      </header>
      <div class="quiz-card" style="text-align:center;">
        <div class="quiz-qnum">Nombrad ${t.palabraCancionesTarget} canción${t.palabraCancionesTarget===1?'':'es'} que contengan la palabra</div>
        <div class="quiz-qtext">"${escapeHtml(t.palabraCancionesWord)}"</div>
        <div class="trivia-answer-label" style="margin-top:16px;">¿Lo han conseguido?</div>
        <div class="trivia-judge-row" style="margin-top:10px;">
          <button style="background:var(--coral);" id="failBtn">❌ No</button>
          <button style="background:var(--teal);" id="correctBtn">✅ Sí (+${TRIVIA_DIFFICULTY[t.difficulty].points})</button>
        </div>
      </div>
      <div class="quiz-actions" style="margin-top:14px;">
        <button class="quiz-btn-secondary" id="changeWordBtn">🔄 Cambiar palabra</button>
        <button class="quiz-btn-secondary" id="resetTriviaBtn">🏠 Reiniciar partida</button>
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('correctBtn').onclick = () => judgePalabraCanciones(true);
    document.getElementById('failBtn').onclick = () => judgePalabraCanciones(false);
    document.getElementById('changeWordBtn').onclick = changePalabraCanciones;
    document.getElementById('resetTriviaBtn').onclick = resetTriviaGame;
    return;
  }

  if(t.phase === 'concursoResult'){
    let summaryLine = '';
    if(t.pruebaType === 'frase'){
      summaryLine = `La frase era: <strong>${escapeHtml(t.frasePhrase)}</strong>`;
    } else if(t.pruebaType === 'sigueLetra'){
      summaryLine = `La canción era: <strong>${escapeHtml(t.sigueLetraSong.title)}</strong> — ${escapeHtml(t.sigueLetraSong.artist)}`;
    } else if(t.pruebaType === 'palabraCanciones'){
      summaryLine = `La palabra era: <strong>${escapeHtml(t.palabraCancionesWord)}</strong> (necesitabais ${t.palabraCancionesTarget})`;
    }
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">${t.lastConcursoCorrect ? '✅ ¡Bien!' : '❌ Esta vez no'}</div>
        <h1>${t.lastConcursoCorrect ? 'Puntos sumados' : 'Sin puntos'}</h1>
      </header>
      <div class="quiz-card" style="text-align:center;">
        <p style="font-size:14px; line-height:1.5;">${summaryLine}</p>
      </div>
      <button class="start-fingers-btn" id="nextTurnBtn">Siguiente turno</button>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('nextTurnBtn').onclick = collectConcursoPoints;
    return;
  }

  if(t.phase === 'rosco'){
    const current = t.roscoQueue[t.roscoActiveIndex];
    const info = TRIVIA_DIFFICULTY[t.roscoDifficulty];
    const pendingCount = t.roscoStatus.filter(s => s === 'pending').length;
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="trivia-turn-badge">Turno de ${currentPlayer ? escapeHtml(currentPlayer.name) : '—'} · ${info.roscoWords} palabras</div>
        <h1>🔤 Rosco</h1>
      </header>
      <div class="rosco-timer" id="roscoTimerDisplay">${Math.floor(t.roscoSecondsLeft/60)}:${String(t.roscoSecondsLeft%60).padStart(2,'0')}</div>
      <div class="rosco-progress">Acertadas: ${t.roscoCorrectCount} · Quedan ${pendingCount} por responder</div>

      <div class="rosco-column">
        ${t.roscoQueue.map((w, i) => {
          const status = t.roscoStatus[i];
          const isActive = i === t.roscoActiveIndex && status === 'pending';
          return `
            <div class="rosco-col-row ${isActive ? 'active' : ''}">
              <div class="rosco-col-letter ${status === 'correct' ? 'correct' : ''}">${w.answer[0]}</div>
              <div class="rosco-col-blank ${status === 'correct' ? 'correct' : ''} ${status === 'given_up' ? 'given-up' : ''}">
                ${status === 'correct' ? escapeHtml(w.answer) : (status === 'given_up' ? escapeHtml(w.answer) : '')}
              </div>
            </div>
          `;
        }).join('')}
      </div>

      ${current ? `
        <div class="quiz-card">
          <div class="quiz-qnum">Definición</div>
          <div class="quiz-qtext">${escapeHtml(current.def)}</div>
          ${t.roscoRevealed ? `
            <div class="trivia-answer-box">
              <div class="trivia-answer-label">Respuesta</div>
              ${escapeHtml(current.answer)}
            </div>
            <button class="start-fingers-btn" id="roscoContinueBtn" style="margin-top:10px;">Continuar</button>
          ` : `
            ${t.roscoFeedback === 'wrong' ? `<div class="rosco-feedback wrong">❌ No es esa palabra, sigue intentando</div>` : ''}
            <input type="text" id="roscoAnswerInput" class="rosco-answer-input" placeholder="Escribe la palabra…" autocomplete="off" autocapitalize="off">
            <div class="quiz-actions" style="margin-top:12px;">
              <button class="quiz-btn-secondary" id="passBtn">➡️ Pasapalabra</button>
              <button class="quiz-btn-primary" id="checkBtn">✅ Comprobar</button>
            </div>
            <div class="quiz-actions" style="margin-top:8px;">
              <button class="quiz-btn-secondary" id="changeRoscoBtn">🔄 Cambiar palabra</button>
              <button class="quiz-btn-secondary" id="giveUpBtn">🏳️ Rendirse</button>
            </div>
            <div style="text-align:center; margin-top:10px;">
              <button class="saved-toggle" id="resetTriviaBtn">🏠 Reiniciar partida</button>
            </div>
          `}
        </div>
      ` : ''}
    `;
    document.getElementById('backMenu').onclick = goMenu;
    const passBtn = document.getElementById('passBtn');
    if(passBtn) passBtn.onclick = passRoscoWord;
    const checkBtn = document.getElementById('checkBtn');
    if(checkBtn) checkBtn.onclick = submitRoscoAnswer;
    const changeRoscoBtn = document.getElementById('changeRoscoBtn');
    if(changeRoscoBtn) changeRoscoBtn.onclick = changeRoscoWord;
    const giveUpBtn = document.getElementById('giveUpBtn');
    if(giveUpBtn) giveUpBtn.onclick = giveUpRosco;
    const resetBtn2 = document.getElementById('resetTriviaBtn');
    if(resetBtn2) resetBtn2.onclick = resetTriviaGame;
    const continueBtn = document.getElementById('roscoContinueBtn');
    if(continueBtn) continueBtn.onclick = continueAfterRoscoReveal;
    const answerInput = document.getElementById('roscoAnswerInput');
    if(answerInput){
      answerInput.focus();
      answerInput.onkeydown = (e) => { if(e.key === 'Enter') submitRoscoAnswer(); };
    }
    return;
  }

  if(t.phase === 'roscoResult'){
    const info = TRIVIA_DIFFICULTY[t.roscoDifficulty];
    const pts = t.roscoCorrectCount * info.points;
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">⏱️ ¡Se acabó el tiempo!</div>
        <h1>${t.roscoCorrectCount} palabra${t.roscoCorrectCount===1?'':'s'} acertada${t.roscoCorrectCount===1?'':'s'}</h1>
      </header>
      <div class="quiz-card" style="text-align:center;">
        <p style="font-size:14px;">${currentPlayer ? escapeHtml(currentPlayer.name) : '—'} suma <strong>${pts} punto${pts===1?'':'s'}</strong> en esta ronda.</p>
      </div>
      <button class="start-fingers-btn" id="nextTurnBtn">Siguiente turno</button>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('nextTurnBtn').onclick = collectRoscoPoints;
    return;
  }

  if(t.phase === 'leaderboard'){
    const sorted = [...t.players].sort((a,b) => b.score - a.score);
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">🧠 Trivial</div>
        <h1>Marcador</h1>
      </header>
      <div style="margin-top:20px;">
        ${sorted.map((p,i) => `
          <div class="leaderboard-row" style="flex-direction:column; align-items:stretch; gap:6px;">
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="leaderboard-rank">${i+1}</div>
              <div class="leaderboard-name">
                <strong>${escapeHtml(p.name)} ${i===0 && sorted.length>1 ? '👑' : ''}</strong>
              </div>
              <div class="leaderboard-percent">${p.score} pts</div>
            </div>
            ${categoryProgressHtml(p, 'light')}
          </div>
        `).join('') || `<div class="empty-players">No hay jugadores.</div>`}
        <div class="quiz-actions" style="margin-top:16px;">
          <button class="quiz-btn-primary" id="continueBtn">▶️ Continuar partida</button>
          <button class="quiz-btn-secondary" id="playersBtn">👥 Jugadores</button>
        </div>
        ${sorted.length ? `
          <div style="text-align:center; margin-top:14px;">
            <button class="saved-toggle" id="resetScoresBtn2">Reiniciar puntuaciones</button>
          </div>
        ` : ''}
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('continueBtn').onclick = () => { startTriviaTurn(); render(); };
    document.getElementById('playersBtn').onclick = backToTriviaPlayers;
    const resetBtn = document.getElementById('resetScoresBtn2');
    if(resetBtn) resetBtn.onclick = restartTriviaScores;
    return;
  }
}

function renderProbable(){
  if(state.view === 'category'){
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header class="menu-header">
        <div class="eyebrow">Señalad todos a la vez</div>
        <h1>¿Quién es <em>más probable</em>?</h1>
        <div class="sub" style="margin:10px auto 0;">Elige la categoría de frases con la que queréis jugar.</div>
      </header>
      <div class="menu-list">
        <button class="game-card probable" data-cat="clasicas">
          <div class="game-emoji">${PROBABLE_CATEGORIES.clasicas.emoji}</div>
          <div>
            <div class="game-title">${PROBABLE_CATEGORIES.clasicas.label}</div>
            <div class="game-desc">${PROBABLE_CATEGORIES.clasicas.desc}</div>
          </div>
        </button>
        <button class="game-card song" data-cat="locura">
          <div class="game-emoji">${PROBABLE_CATEGORIES.locura.emoji}</div>
          <div>
            <div class="game-title">${PROBABLE_CATEGORIES.locura.label}</div>
            <div class="game-desc">${PROBABLE_CATEGORIES.locura.desc}</div>
          </div>
        </button>
      </div>
    `;
    document.getElementById('backMenu').onclick = goMenu;
    app.querySelectorAll('[data-cat]').forEach(btn=>{
      btn.onclick = () => selectCategory(btn.dataset.cat);
    });
    return;
  }

  if(state.view === 'saved'){
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">Tus favoritas</div>
        <h1>Frases <em>guardadas</em></h1>
      </header>
      <div class="saved-panel">
        <div class="saved-header">
          <h3>${state.liked.length} guardada${state.liked.length===1?'':'s'}</h3>
          <button class="back-link" id="backBtn">← Volver</button>
        </div>
        <div class="saved-list">
          ${state.liked.length ? state.liked.map((q,i)=>`
            <div class="saved-item">
              <span>${escapeHtml(q)}</span>
              <button class="remove-btn" data-i="${i}" title="Quitar">✕</button>
            </div>
          `).join('') : `<div class="empty-saved">Aún no has marcado ninguna con "Me gusta".</div>`}
        </div>
      </div>
    `;
    document.getElementById('backBtn').onclick = goBack;
    document.getElementById('backMenu').onclick = goMenu;
    app.querySelectorAll('.remove-btn').forEach(btn=>{
      btn.onclick = () => removeSaved(parseInt(btn.dataset.i));
    });
    return;
  }

  if(state.view === 'done'){
    app.innerHTML = `
      <button class="top-back" id="backMenu">← Menú</button>
      <header>
        <div class="eyebrow">Ronda terminada</div>
        <h1>Se acabaron <em>las tarjetas</em></h1>
      </header>
      <div class="done">
        <p>Has revisado las ${state.deck.length} frases. Guardaste ${state.liked.length} con "Me gusta".</p>
        <button class="restart-btn" id="restartBtn">Barajar y jugar otra vez</button>
      </div>
      <footer>
        <button class="saved-toggle" id="savedBtn">Ver guardadas (${state.liked.length})</button>
        <div style="margin-top:6px;">
          <button class="saved-toggle" id="changeCatBtn">Cambiar categoría</button>
        </div>
      </footer>
    `;
    document.getElementById('restartBtn').onclick = restart;
    document.getElementById('savedBtn').onclick = goSaved;
    document.getElementById('backMenu').onclick = goMenu;
    document.getElementById('changeCatBtn').onclick = changeCategory;
    return;
  }

  const q = state.deck[state.index];
  const total = state.deck.length;
  const pct = Math.round((state.index/total)*100);

  app.innerHTML = `
    <button class="top-back" id="backMenu">← Menú</button>
    <header>
      <div class="eyebrow">${PROBABLE_CATEGORIES[state.probableCategory].emoji} ${PROBABLE_CATEGORIES[state.probableCategory].label}</div>
      <h1>¿Quién es <em>más probable</em>?</h1>
      <div class="sub">Lee la frase en voz alta y todo el grupo señala a quien crea que encaja. Dale a "me gusta" para guardarla y pasar a la siguiente.</div>
    </header>

    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-count">${state.index+1}/${total}</div>
    </div>

    <div class="stage">
      <div class="card behind-2"></div>
      <div class="card behind-1"></div>
      <div class="card top ${state.animClass}" id="cardTop">
        <div class="card-index">#${state.index+1}</div>
        <div class="card-text">${escapeHtml(q)}</div>
        <div class="finger">👉</div>
      </div>
    </div>

    <div class="actions">
      <button class="choice btn-dislike" id="dislikeBtn">
        <span class="btn-icon">✕</span>
        No me gusta
      </button>
      <button class="choice btn-like" id="likeBtn">
        <span class="btn-icon">♥</span>
        Me gusta
      </button>
    </div>

    <footer>
      <button class="saved-toggle" id="savedBtn">Ver guardadas (${state.liked.length})</button>
      <div style="margin-top:6px;">
        <button class="saved-toggle" id="changeCatBtn">Cambiar categoría</button>
      </div>
    </footer>
  `;

  document.getElementById('dislikeBtn').onclick = () => choose('dislike');
  document.getElementById('likeBtn').onclick = () => choose('like');
  document.getElementById('savedBtn').onclick = goSaved;
  document.getElementById('backMenu').onclick = goMenu;
  document.getElementById('changeCatBtn').onclick = changeCategory;

  if(state.animClass === 'enter'){
    setTimeout(()=>{ state.animClass=''; }, 300);
  }
}

loadLiked();
loadCitadelsPlayers();
loadSongPlayers();
loadQuizPlayers();
loadSciQuizPlayers();
loadTriviaPlayers();
render();

// Aviso de confirmación al cerrar/salir mientras se está dentro de un juego,
// para evitar cierres o "atrás" accidentales que corten una partida en curso.
window.addEventListener('beforeunload', (e) => {
  if(state.screen !== 'menu'){
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>

</html>
